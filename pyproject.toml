# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apisdkopti24"
version = "3.2.1"
description = "Асинхронный Python-клиент для сервиса API топливных карт"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Andrey Raspopov", email = "andrey.raspopov@gmail.com" },
]
requires-python = ">=3.11,<3.15"
keywords = ["api-client", "asyncio", "httpx", "dataclasses", "fuel-cards", "sdk"]

dependencies = [
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.13.4,<3.0",
]

[project.urls]
Homepage = "https://github.com/raspopovaa/apisdkopti24"
Documentation = "https://raspopovaa.github.io/apisdkopti24/"
Repository = "https://github.com/raspopovaa/apisdkopti24"
Issues = "https://github.com/raspopovaa/apisdkopti24/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apisdkopti24*"]
exclude = ["examples", "tests", "docs"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "ruff>=0.5.0",
    "black>=24.3.0",
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.7.7,<10.0",
    "mike>=2.2.0,<3.0",
    "mypy>=1.10.0",
    "pyyaml>=6.0.2,<7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = true

[tool.ruff]
# Общие настройки (например, target-version, line-length)
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Настройки линтера
select = ["E", "W", "F", "I", "B", "C4", "T10", "SIM", "PTH", "ARG", "UP", "YTT"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
"scripts/generate_api_docs.py" = ["E402"]
"scripts/generate_method_catalog.py" = ["E402"]
"scripts/run_mock_load_test.py" = ["E402"]
"scripts/audit_spec_contract.py" = ["E402"]
"scripts/documentation_generator.py" = ["E402"]
"scripts/export_endpoint_contracts.py" = ["E402"]
"scripts/generate_docs.py" = ["E402"]
"scripts/verify_external_contract.py" = ["E402"]
"scripts/verify_api_contract.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = "(venv|tests|build|dist)"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["apisdkopti24"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

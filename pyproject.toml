# pyproject.toml
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apisdkopti24"
version = "0.0.3"
description = "Асинхронный Python SDK для Opti24 API — API топливных карт АЗС"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Andrey Raspopov", email = "andrey.raspopov@gmail.com" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = [
    "opti24",
    "opti24-api",
    "fuel-cards",
    "fuel-card-api",
    "api-client",
    "asyncio",
    "httpx",
    "sdk",
    "API топливных карт",
    "топливные карты",
    "ОПТИ 24",
]

dependencies = [
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.13.4,<3.0",
]

[project.urls]
Homepage = "https://github.com/raspopovaa/apisdkopti24"
Documentation = "https://raspopovaa.github.io/apisdkopti24/"
Repository = "https://github.com/raspopovaa/apisdkopti24"
Issues = "https://github.com/raspopovaa/apisdkopti24/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apisdkopti24*"]
exclude = ["examples", "tests", "docs"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
# Маркер PEP 561: без него mypy и pyright считают пакет нетипизированным.
apisdkopti24 = ["py.typed"]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "ruff>=0.5.0",
    "black>=24.3.0",
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.7.7,<10.0",
    "mike>=2.2.0,<3.0",
    "mypy>=1.10.0",
    "pyyaml>=6.0.2,<7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = true

[tool.ruff]
# Общие настройки (например, target-version, line-length)
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
# Настройки линтера
select = ["E", "W", "F", "I", "B", "C4", "T10", "SIM", "PTH", "ARG", "UP", "YTT"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
"scripts/run_mock_load_test.py" = ["E402"]
"scripts/audit_spec_contract.py" = ["E402"]
"scripts/documentation_generator.py" = ["E402"]
"scripts/export_endpoint_contracts.py" = ["E402"]
"scripts/generate_docs.py" = ["E402"]
"scripts/verify_external_contract.py" = ["E402"]
"scripts/verify_api_contract.py" = ["E402"]

[tool.pylint.main]
# typecheck/ — файлы для проверки типов mypy: повторяющиеся вызовы в них намеренны.
ignore-paths = ["^typecheck/"]

[tool.pylint.similarities]
# Дубли короче 12 строк — шаблонный код сгенерированных примеров и вызовы API;
# порог оставляет заметные повторы, например одинаковую подготовку клиента в тестах.
min-similarity-lines = 12
ignore-imports = true

[tool.pylint."messages control"]
# Pylint запускает Codacy. Отключено то, что противоречит соглашениям проекта или
# уже проверяют Ruff и Black; остальные проверки Pylint действуют.
disable = [
    # docstring нужен публичному поведению, а не каждой функции (AGENTS.md).
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Модели Pydantic, протоколы и dataclass; сигнатуры повторяют параметры API.
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    # «from x import Y as Y» — явный реэкспорт для mypy --strict.
    "useless-import-alias",
    # Длину строк, порядок импортов и неиспользуемые аргументы проверяет Ruff.
    "line-too-long",
    "wrong-import-position",
    "unused-argument",
    # Идиомы pytest: сравнение с [] в assert и фикстуры с именами из внешней области.
    "use-implicit-booleaness-not-comparison",
    "redefined-outer-name",
]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = "(venv|tests|build|dist)"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["apisdkopti24"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

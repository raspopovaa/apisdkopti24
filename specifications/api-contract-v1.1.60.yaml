        \ – Запрос списка топлива для цен на АЗС.\n• PaymentScheme – Запрос списка схем оплаты договора.\n• PaymentTerm\
        \ – Запрос списка условий оплаты договора.\n• ProductGroup – Запрос списка групп продукта. \n• ProductType\
        \ – Запрос списка типов продукта.\n• POIType – Запрос списка типов принадлежности АЗС.\n• Region – Запрос\
        \ списка регионов.\n• Services – Запрос списка услуг на АЗС.\n• Unit – Запрос списка единиц измерения продуктов\n\
        • Office – Запрос списка офисов продаж\n• POIPartner – Запрос списка партнеров\n• DiscountScheme – Запрос\
        \ списка схем расчета скидки"

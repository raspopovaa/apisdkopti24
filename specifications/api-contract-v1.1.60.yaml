schema_version: 2
source:
  title: Спецификация протокола API для корпоративных клиентов
  version: 1.1.60
  date: '2025-10-01'
  original_format: docx
  stored_in_repository: false
  sha256: 1a3a556a922470490b8667f005a07427c6660aa916f6609f9a723f8fe4926191
  sanitization: API keys, session identifiers and password hashes are redacted
methods:
- external_code: authuser
  operation: auth_user
  route_name: default
  http_method: POST
  api_version: v1
  endpoint: authUser
  demo_available: true
  billable: false
  sdk:
    service: auth
    parameters:
    - name: api_version
      type: str | None
      required: false
      keyword_only: true
      default: null
    - name: contract_id
      type: str | None
      required: false
      keyword_only: true
      default: null
    - name: contract_number
      type: str | None
      required: false
      keyword_only: true
      default: null
    response:
      kind: model
      model: AuthUserResponse
      fields:
      - status
      - data
      - timestamp
  api:
    section: Авторизация пользователя
    request_parameters:
    - name: login
      type: string
      required: true
      description: Логин пользователя
    - name: password
      type: string
      required: true
      description: Пароль пользователя, захешированный функцией SHA-512 по стандарту SHS - FIPS 180-4, результат
        хеширования в нижнем регистре
    response_fields:
    - name: client_id
      type: string
      required: true
      description: ID клиента
    - name: client_status
      type: string
      required: true
      description: Статус пользователя
    - name: org_name
      type: string
      required: true
      description: Название организации
    - name: session_id
      type: string
      required: true
      description: ID текущей сессии пользователя
    - name: user_id
      type: string
      required: true
      description: ID пользователя
    - name: contracts
      type: json
      required: true
      description: Данные договоров доступных пользователю
    - name: role_id
      type: string
      required: true
      description: ID роли пользователя
    - name: role_name
      type: string
      required: true
      description: Название роли пользователя
    - name: read_only
      type: bool
      required: true
      description: Режим чтения
    - name: user_name
      type: string
      required: false
      description: Имя пользователя
    - name: user_patronymic
      type: string
      required: false
      description: Отчество пользователя
    - name: user_surname
      type: string
      required: false
      description: Фамилия пользователя
    - name: last_contract
      type: string
      required: false
      description: Последний используемый договор
    - name: access
      type: json
      required: true
      description: Доступ в ЛК/МП/API
    - name: email
      type: string
      required: true
      description: Email
    - name: phone
      type: string
      required: false
      description: Телефон
    - name: Поля объекта access
      type: Поля объекта access
      required: false
      description: Поля объекта access
    - name: web
      type: bool
      required: true
      description: Доступ ЛК
    - name: api
      type: bool
      required: true
      description: Доступ API
    - name: mobile
      type: bool
      required: true
      description: Доступ МП
    - name: Поля объекта contracts
      type: Поля объекта contracts
      required: false
      description: Поля объекта contracts
    - name: id
      type: string
      required: true
      description: ID договора
    - name: number
      type: string
      required: true
      description: Номер договора
    - name: mpc
      type: bool
      required: true
      description: Возможность выпуска МПК
    - name: template_id
      type: string
      required: false
      description: ID шаблона ВК
    - name: cards_count
      type: uint
      required: true
      description: Количество топливных карт на договоре
    - name: one_price
      type: bool
      required: true
      description: Единая цена
    official_example:
      request: "Пример запроса: \nPOST: http://localhost/vip/v1/authUser\nBODY: login=VashLogin&password=<redacted>"
      response: "Пример ответа: \n{\n\"status\": {\n\"code\": 200\n},\n\"data\": {\n\"client_id\": \"1-2Q45DA8\"\
        ,\n\"client_status\": \"Active\",\n\"org_name\": \"Клиент ЛК АО\",\n\"session_id\": \"<redacted-session>\"\
        ,\n\"user_id\": \"1-2Q468ZB\",\n\"contracts\": [\n{\n\"id\": \"1-2Q4CNBH\",\n\"number\": \"ЯР4030436\",\n\
        \"mpc\": true,\n\"template_id\": \"1-3BDZMRJ\",\n\"cards_count\": 11,\n\"one_price\": false\n},\n{\n\"id\"\
        : \"1-2Q4CN99\",\n\"number\": \"ЯР4030435\",\n\"mpc\": false,\n\"template_id\": null,\n\"cards_count\":\
        \ 401,\n\"one_price\": false\n},\n{\n\"id\": \"1-2Q4C2L2\",\n\"number\": \"ЯР4030434\",\n\"mpc\": false,\n\
        \"template_id\": null,\n\"cards_count\": 155,\n\"one_price\": false\n}\n],\n\"role_id\": \"Supervisor\"\
        ,\n\"role_name\": \"Администратор\",\n\"read_only\": false,\n\"user_name\": \"Петр\",\n\"user_patronymic\"\
        : \"Петрович\",\n\"user_surname\": \"Петров\",\n\"last_contract\": \"1-2Q4CNBH\",\n\"access\": {\n\"web\"\
        : true,\n\"api\": true,\n\"mobile\": true\n},\n\"email\": \"test@test.com\",\n\"phone\": \"79999999999\"\
        \n},\n\"timestamp\": 1596024392\n}\nДеавторизация пользователя"
- external_code: logoff

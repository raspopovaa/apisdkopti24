        "code": 200

        },

        "data": true,

        "timestamp": 1586308843

        }

        Виртуальная карта – Virtual Card

        Администратор API может выпускать новые виртуальные карты, настраивать их и привязывать к пользователям.
        Для выпуска карты необходимо наличие номера телефона у пользователя API. На текущий момент установка и изменение
        номера телефона доступны через персонального менеджера по договору.

        Выпуск виртуальных карт осуществляется с использованием методов: Запрос на выпуск виртуальной карты или
        Запрос на выпуск виртуальной карты (v.2).

        Для обслуживания по виртуальным картам используется мобильный профиль карты (МПК) – security величины для
        генерации QR-кодов. МПК хранится на мобильном устройстве держателя карты.

        Администратор может удалить МПК по карте методом deleteMPC. При выпуске МПК требуется подтвердить операцию
        СМС – кодом. В сутки доступно 5 попыток активации МПК, администратор API может сбросить счетчик методом
        resetMPC.'

      type: При успехе передается true
      required: false
      description: При успехе передается true
    official_example:
      request: 'Пример запроса:

        DELETE: http://localhost/vip/v2/users/1-FK485FK

        Если ваша система не умеет отправлять DELETE запросы, то можно отправить POST, но в BODY указать _method=DELETE:

        POST: http://localhost/vip/v2/users/1-FK485FK

        BODY: _method=DELETE'
      response: 'Пример ответа:

        {

        "status": {

        "code": 200

        },

        "data": true,

        "timestamp": 1596024392

        }

        Шаблоны ВК – Templates

        ВК – виртуальная карта. Чтобы выпустить ВК, потребуется создать шаблон ВК и прикрепить его к пользователю,
        который будет выпускать виртуальные карты. Прикрепление карты происходит на этапе приглашения нового пользователя
        или методом прикрепления карты к существующим пользователям.

        Шаблон ВК – это первоначальные параметры (тип карты, лимиты, ограничители), с которыми будет выпущена ВК,
        если использовать данный шаблон. С точки зрения безопасности шаблон сделан для того, чтобы по умолчанию
        все выпускаемые ВК имели ограничения (лимиты/ограничители).

        Методы из данного раздела позволяют получать список уже существующих шаблонов, создавать новые, изменять
        и удалять их, а также управлять лимитами и ограничителями на шаблонах.

        Список шаблонов ВК'

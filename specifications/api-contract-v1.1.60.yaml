- external_code: getpartcontractdata
  operation: get_contract_data
  route_name: default
  http_method: GET
  api_version: v1
  endpoint: getPartContractData
  demo_available: true
  billable: true
  sdk:
    service: contracts
    parameters:
    - name: contract_id
      type: str | None
      required: false
      keyword_only: true
      default: null
    - name: api_version
      type: str | None
      required: false
      keyword_only: true
      default: null
    response:
      kind: model
      model: ContractDataResponse
      fields:
      - status
      - data
      - timestamp
  api:
    section: Данные по договору
    request_parameters:
    - name: contract_id
      type: string
      required: true
      description: ID контракта
    response_fields:
    - name: mpc
      type: bool
      required: true
      description: Разрешен ли выпуск виртуальных карт
    - name: template_id
      type: string
      required: true
      description: ID шаблона виртуальных карт
    - name: status
      type: string
      required: true
      description: Статус Way4
    - name: status_crm
      type: string
      required: true
      description: Статус СРМ
    - name: payment_term_id
      type: string
      required: false
      description: ID справочника условия оплаты
    - name: payment_scheme_id
      type: string
      required: false
      description: ID cправочника схема оплаты
    - name: Is_dealer
      type: bool
      required: true
      description: Признак дилерский
    - name: balanceData
      type: json
      required: true
      description: Данные по расходу и балансу договора
    - name: contractData
      type: json
      required: true
      description: Данные договора
    - name: managerData
      type: json
      required: true
      description: Данные по менеджеру договора
    - name: cardsData
      type: json
      required: true
      description: Данные по количеству карт и групп карт на договоре

        DELETE: http://localhost/vip/v2/vc/templates/1-3BDZMRJ/georestrictions/1-3BE55MK

        Если ваша система не умеет отправлять DELETE запросы, то можно отправить POST, но в BODY указать _method=DELETE:

        POST: http://localhost/vip/v2/vc/templates/1-3BDZMRJ/georestrictions/1-3BE55MK


- external_code: info
  operation: get_info
  route_name: default
  http_method: GET
  api_version: v1
  endpoint: info
  demo_available: true
  billable: false
  sdk:
    service: auth
    parameters:
    - name: api_version
      type: str | None
      required: false
      keyword_only: true
      default: null
    - name: period
      type: str | None
      required: false
      keyword_only: true
      default: null

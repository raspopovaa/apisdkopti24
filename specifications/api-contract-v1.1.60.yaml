      type: Поля объекта balanceData
      required: false
      description: Поля объекта balanceData
    - name: available_amount
      type: string
      required: true
      description: Доступный остаток
    - name: own_balance
      type: string
      required: true
      description: Собственные средства
    - name: balance
      type: string
      required: true
      description: Собственные средства клиента с учетом блокировок
    - name: consumption_for_month
      type: string
      required: true
      description: Расход в текущем месяце (в валюте контракта)
    - name: consumption_for_month_volume
      type: string
      required: true
      description: Объем потребления в текущем месяце (в литрах)
    - name: consumption_for_prev_month_volume
      type: string
      required: true
      description: Объем потребления в предыдущем месяце (в литрах)
    - name: last_payment_sum
      type: string
      required: false
      description: Сумма последнего платежа
    - name: last_payment_date
      type: string
      required: false
      description: Дата последнего платежа
    - name: currency
      type: string
      required: true
      description: Валюта договора
    - name: Поля объекта contractData
      type: Поля объекта contractData
      required: false
      description: Поля объекта contractData
    - name: contract_id
      type: string
      required: true
      description: ID договора
    - name: way_id
      type: string
      required: true

schema_version: 1
domain: cards
source_version: 1.1.60
operations:
  get_cards_v2:
    summary: Список карт договора (v.2)
    verification: provisional
    service: cards
    request_model: null
    variants:
    - route_name: default
      source_section: Список карт договора (v.2)
      request_line: 'Запрос: GET http://localhost/vip/v2/cards'
      request_parameters:
      - path: contract_id
        api_type: string
        required: false
        description: ID договора (Можно передать в заголовке запроса, а не только в URI - строке). Если не передать,
          то подставим 1й договор из списка.
      - path: group_id
        api_type: string
        required: false
        description: ID группы карт. При передаче параметра отобразит только карты этой группы.
      - path: sort
        api_type: string
        required: false
        description: Сортировка (sort=-id). Поле для сортировки указываются в виде строки, GET параметра sort, если
          перед наименованием поля поставить знак - , будет осуществляться сортировка по убыванию (DESC).
      - path: q
        api_type: string
        required: false
        description: Поисковый запрос (Ищет по комментарию на карте, по номерам карт).
      - path: status
        api_type: string
        required: false
        description: Фильтрует по статусам карт (Справочник CardStatus)
      - path: carrier
        api_type: string
        required: false
        description: Фильтрует по типу карты (Plastic – физическая карта, Virtual Card – виртуальная карта).
      - path: platon
        api_type: bool
        required: false
        description: Отобразит карты с подключенной услугой Платон.
      - path: avtodor
        api_type: bool
        required: false
        description: Отобразит карты с подключенной услугой Автодор.
      - path: users
        api_type: bool
        required: false
        description: С помощью данного параметра подгружаются пользователи и в списке карт заполняются поля users
          и mpc. Время ответа зависит от количества карт и количества пользователей.
      - path: page
        api_type: string
        required: false
        description: Номер страницы (Пагинация).
      - path: onpage
        api_type: string
        required: false
        description: Элементов на странице (Пагинация).
      response_fields:
      - path: data.total_count
        api_type: uint
        required: true
        description: Количество
      - path: data.result
        api_type: json
        required: false
        description: Массив данных
      - path: data.result[].id
        api_type: string
        required: true
        description: ID карты
      - path: data.result[].group_id
        api_type: string
        required: false
        description: ID группы карт, к которой принадлежит карта
      - path: data.result[].group_name
        api_type: string
        required: false
        description: Название группы карт, к которой принадлежит карта
      - path: data.result[].contract_id
        api_type: string
        required: true
        description: ID договора
      - path: data.result[].contract_name
        api_type: string
        required: true
        description: Наименование договора
      - path: data.result[].number
        api_type: string
        required: true
        description: Номер карты
      - path: data.result[].status
        api_type: string
        required: true
        description: ID статуса карты
      - path: data.result[].status_name
        api_type: string
        required: false
        description: Название статуса карты
      - path: data.result[].comment
        api_type: string
        required: false
        description: Комментарий карты
      - path: data.result[].product
        api_type: string
        required: true
        description: ID типа продукта
      - path: data.result[].product_name
        api_type: string
        required: false
        description: Название типа продукта
      - path: data.result[].carrier
        api_type: string
        required: true
        description: Тип карты
      - path: data.result[].carrier_name
        api_type: string
        required: false
        description: Название типа карты
      - path: data.result[].platon
        api_type: bool
        required: true
        description: Возможность использования услуги Платон
      - path: data.result[].avtodor
        api_type: bool
        required: true
        description: Возможность использования услуги Автодор
      - path: data.result[].sync_group_state
        api_type: string
        required: false
        description: Статус синхронизации группы карт
      - path: data.result[].users
        api_type: '[string, string]'
        required: false
        description: Список ID пользователей к которым привязана карта
      - path: data.result[].mpc
        api_type: bool
        required: false
        description: Существует ли МПК на карте
      fixture: tests/fixtures/spec/1.1.60/cards/get_cards_v2.success.json
      fixture_status: spec-only
      fixture_corrections: []
  get_cards_v1:

        required: false
        description: Кеш карт. false или не задан - данные берутся по прямому запросу из процессинга.
      response_fields:
      - path: data.total_count
        api_type: uint
        required: true
        description: Количество
      - path: data.result
        api_type: json
        required: false
        description: Массив данных
      - path: data.result[].id
        api_type: string
        required: true
        description: ID карты
      - path: data.result[].contract_id
        api_type: string
        required: true
        description: ID договора
      - path: data.result[].number
        api_type: string
        required: true
        description: Номер карты
      - path: data.result[].status
        api_type: string
        required: true
        description: ID статуса карты
      - path: data.result[].can_work_offline
        api_type: bool
        required: true
        description: Возможность обслуживания карты в режиме оффлайн
      - path: data.result[].card_auth_type
        api_type: string
        required: true
        description: Наименование способа авторизации карты
      - path: data.result[].comment
        api_type: string
        required: false
        description: Комментарий карты
      - path: data.result[].date_expired
        api_type: string
        required: true
        description: Дата окончания срока действия
      - path: data.result[].date_last_usage
        api_type: string
        required: false
        description: Дата последнего использования
      - path: data.result[].date_released
        api_type: string
        required: false
        description: Дата выпуска карты
      - path: data.result[].servicecenter_last_usage
        api_type: string
        required: false
        description: ID ТО последнего обслуживания
      - path: data.result[].transaction_last_detail
        api_type: string
        required: false
        description: Детали последней транзакции
      - path: data.result[].transaction_timeout
        api_type: json
        required: false
        description: Минимальное время между транзакциями
      - path: data.result[].product
        api_type: string
        required: true
        description: Тип продукта (Лимитная карта или Электронный кошелек)
      - path: data.result[].payment_of_tolls
        api_type: string
        required: true
        description: Возможность оплаты дорожных сборов
      - path: data.result[].transaction_timeout.type
        api_type: uint
        required: true
        description: Единицы изменения
      - path: data.result[].transaction_timeout.value
        api_type: uint
        required: true
        description: Значение ограничения
      fixture: tests/fixtures/spec/1.1.60/cards/get_cards_v1.success.json
      fixture_status: spec-only
      fixture_corrections: []

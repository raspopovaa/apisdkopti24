        description: Ограничение по числу транзакций за период
      - path: limit[].amount.unit
        api_type: string
        required: true
        description: Единица измерения
      - path: limit[].amount.value
        api_type: uint
        required: true
        description: Суммарное количество ограничения
      - path: limit[].sum.currency
        api_type: string
        required: true
        description: Валюта
      - path: limit[].sum.value
        api_type: uint

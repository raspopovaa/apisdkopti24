        description: Суммарный размер ограничения
      - path: limit[].term.days
        api_type: string[7]
        required: false
        description: Строка из 7 нулей и единиц. 1 – ограничение применяется в этот день, 0 – нет
      - path: limit[].term.time
        api_type: json

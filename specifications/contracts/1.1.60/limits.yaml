      - path: limit[].term.type
        api_type: uint
        required: true
        description: 'Способ применения ограничения: 1 – Ограничение применяется всегда (во все указанные дни недели).
          2 – Ограничение применяется только в рабочие дни. 3 – Ограничение применяется только в выходные и праздничные
          дни'
      - path: term.time.from
        api_type: string
        required: true
        description: От
      - path: term.time.to
        api_type: string
        required: true
        description: До
      - path: limit[].term.time.number
        api_type: uint
        required: true
        description: Значение.
      - path: limit[].term.time.type
        api_type: uint
        required: true
        description: Период действия ограничения. 2 – Разовый, 3 – Сутки, 4 – Неделя, 5 – Месяц, 6 – Квартал, 7
          – Год
      - path: limit[].transactions.count
        api_type: uint
        required: true
        description: Количество транзакций по услуге
      response_fields:
      - path: data.data

schema_version: 1
domain: templates
source_version: 1.1.60
operations:
  get_templates:
    summary: Список шаблонов ВК
    verification: provisional
    service: templates
    request_model: null
    variants:
    - route_name: default
      source_section: Список шаблонов ВК
      request_line: 'Запрос: GET http://localhost/vip/v2/vc/templates'
      request_parameters:
      - path: contract_id
        api_type: string
        required: false
        description: ID договора (Можно передать в заголовке запроса, а не только в URI - строке) Если не передать,
          то в ответе придут все шаблоны клиента.
      response_fields:
      - path: data.total_count
        api_type: uint
        required: true
        description: Количество
      - path: data.result
        api_type: json
        required: false
        description: Массив данных
      - path: data.result[].id
        api_type: string
        required: true
        description: ID шаблона
      - path: data.result[].name
        api_type: string
        required: true
        description: Название шаблона (Уникальное в рамках договора)
      - path: data.result[].type
        api_type: string
        required: true
        description: Тип карты (Limit – лимитная схема, Wallet – электронный кошелек)
      - path: data.result[].contract_id
        api_type: string
        required: true
        description: ID договора
      fixture: tests/fixtures/spec/1.1.60/templates/get_templates.success.json
      fixture_status: spec-only
      fixture_corrections: []
  create_template:
    summary: Создание шаблона ВК
    verification: provisional
    service: templates

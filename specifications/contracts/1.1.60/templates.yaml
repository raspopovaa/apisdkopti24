        api_type: json
        required: false
        description: Время обслуживания
      - path: data.result[].term.type
        api_type: uint
        required: true
        description: Способ применения ограничения. 1 - Ограничение применяется всегда (во все указанные дни недели)
          2 - Ограничение применяется только в рабочие дни 3 - Ограничение применяется только в выходные и праздничные
          дни

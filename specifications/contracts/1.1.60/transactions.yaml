      - path: data.total_count
        api_type: uint
        required: true
        description: Количество
      - path: data.result
        api_type: json
        required: false
        description: Массив данных
      - path: data.result[].id
        api_type: string
        required: true
        description: ID транзакции
      - path: data.result[].timestamp
        api_type: string
        required: true
        description: Дата и время транзакции по местному времени
      - path: data.result[].utc_time
        api_type: string
        required: true
        description: Дата и время транзакции по UTC
      - path: data.result[].card_id
        api_type: string
        required: true
        description: ID карты
      - path: data.result[].poi_id
        api_type: string
        required: true
        description: ID точки обслуживания
      - path: data.result[].terminal_id
        api_type: string
        required: true
        description: ID терминала
      - path: data.result[].type
        api_type: string
        required: true
        description: ID типа транзакции
      - path: data.result[].product_id
        api_type: string
        required: true
        description: ID продукта
      - path: data.result[].product_name
        api_type: string
        required: true
        description: Наименование товара
      - path: data.result[].product_category_id
        api_type: string
        required: true
        description: ID категории продукта
      - path: data.result[].currency
        api_type: string
        required: true
        description: ID валюты
      - path: data.result[].check_id
        api_type: string
        required: true
        description: ID чека
      - path: data.result[].stor_transaction_id
        api_type: string
        required: true
        description: ID прямой транзакции
      - path: data.result[].is_storno
        api_type: bool
        required: true
        description: Признак сторнирования
      - path: data.result[].is_manual_correction
        api_type: bool
        required: true
        description: Признак ручной корректировки
      - path: data.result[].qty
        api_type: float
        required: true
        description: Количество единиц товара
      - path: data.result[].price
        api_type: float
        required: true
        description: Цена со скидкой клиента
      - path: data.result[].price_no_discount
        api_type: float
        required: true
        description: Цена без скидки
      - path: data.result[].sum
        api_type: float
        required: true
        description: Сумма со скидкой клиента
      - path: data.result[].sum_no_discount
        api_type: float
        required: true
        description: Сумма без скидки
      - path: data.result[].discount
        api_type: float
        required: true
        description: Сумма скидки
      - path: data.result[].exchange_rate
        api_type: float
        required: true
        description: Курс пересчёта
      - path: data.result[].card_number
        api_type: string
        required: true
        description: Номер карты
      - path: data.result[].payment_type
        api_type: string
        required: true
        description: Тип платежа
      fixture: tests/fixtures/spec/1.1.60/transactions/get_transactions_v2.success.json
      fixture_status: spec-only
      fixture_corrections: []
    source_decisions:
    - path: data.result[].is_manual_corrention
      status: source-patch-applied
      reason: Версия 1.1.60 исправляет имя поля is_manual_corrention в транзакционных методах.
      note: Поле не было однозначно восстановлено из базовой таблицы; решение сохранено отдельно.

schema_version: 1
domain: dictionaries
source_version: 1.1.60
operations:
  get_azs_list_v1:
    summary: Список торговых точек
    verification: provisional
    service: dictionaries
    request_model: null
    variants:
    - route_name: default
      source_section: Список торговых точек
      request_line: 'Запрос: GET http://localhost/vip/v1/AZS'
      request_parameters:
      - path: page
        api_type: uint
        required: false
        description: Номер страницы начиная с 1
      - path: onpage
        api_type: uint
        required: false
        description: Количество элементов на странице (0 – если нужно вывести все элементы)
      - path: filter
        api_type: json
        required: false
        description: JSON объект для фильтрации списка
      - path: q
        api_type: string
        required: false
        description: Поисковая строка запроса (Ищет по наименованию ТТ, адресу и номеру терминала)
      - path: id
        api_type: string
        required: false
        description: ID торговой точки (для детального показа 1й ТТ)
      - path: filter.region
        api_type: '[string, string]'
        required: false
        description: Массив регионов (справочник Region)
      - path: filter.country
        api_type: '[string, string]'
        required: false
        description: Массив стран (справочник Country)
      - path: filter.owntype
        api_type: '[string, string]'
        required: false
        description: Массив типов собственности (справочник OwnType)
      - path: filter.type
        api_type: '[string, string]'
        required: false
        description: Массив типов принадлежности (справочник POIType)
      - path: filter.status
        api_type: '[string, string]'
        required: false
        description: Массив статусов (257 - ТТ работает, 258 - ТТ не работает)
      - path: filter.services
        api_type: '[uint,uint]'
        required: false
        description: Массив предоставляемых услуг на ТТ (справочник Services)
      - path: filter.goods
        api_type: '[string, string]'
        required: false
        description: Массив имеющейся в продаже номенклатуры (справочник GoodsCode)
      response_fields:
      - path: data.total_count
        api_type: uint
        required: true
        description: Количество
      - path: data.result
        api_type: json
        required: false
        description: Массив данных
      - path: data.result[].id
        api_type: string
        required: true
        description: ID торговой точки
      - path: data.result[].siebelId
        api_type: string
        required: true
        description: ID торговой точки (для отчета)
      - path: data.result[].contractNumber
        api_type: string
        required: true
        description: Код ТТ
      - path: data.result[].contractName
        api_type: string
        required: true
        description: Название торговой точки
      - path: data.result[].status
        api_type: string
        required: true
        description: Статус торговой точки, 257 – работает, 258 – не работает
      - path: data.result[].countryCode
        api_type: string
        required: true
        description: Код страны
      - path: data.result[].regionCode
        api_type: string
        required: true
        description: Код региона
      - path: data.result[].secessionGPN
        api_type: string
        required: false
        description: Тип по местоположению
      - path: data.result[].belongsTo
        api_type: string
        required: true
        description: Название
      - path: data.result[].partner
        api_type: string
        required: true
        description: ID партнера
      - path: data.result[].ownType
        api_type: string
        required: true
        description: Тип собственности по отношению к ГПН
      - path: data.result[].locationType
        api_type: string
        required: false
        description: Расположение
      - path: data.result[].brand
        api_type: string
        required: false
        description: Бренд
      - path: data.result[].openDate
        api_type: string
        required: true
        description: Дата открытия
      - path: data.result[].closeDate
        api_type: string
        required: false
        description: Дата закрытия тип торговой точки
      - path: data.result[].latitude
        api_type: string
        required: true
        description: Координаты – широта
      - path: data.result[].longitude
        api_type: string
        required: true
        description: Координаты – долгота
      - path: data.result[].type
        api_type: string
        required: true
        description: Тип торговой точки
      - path: data.result[].timeZone
        api_type: string
        required: false
        description: Часовой пояс
      - path: data.result[].services
        api_type: '[uint,uint]'
        required: false
        description: Массив с ID услугами. Описание услуг можно посмотреть в справочнике Services.
      - path: data.result[].terminals
        api_type: json
        required: false
        description: Терминалы ТТ
      - path: data.result[].address
        api_type: json
        required: true
        description: Адрес АЗС
      - path: data.result[].searchTxt
        api_type: string
        required: true

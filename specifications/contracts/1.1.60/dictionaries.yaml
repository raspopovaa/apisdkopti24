      - path: data.result[].accept_cards
        api_type: bool
        required: false
        description: Принимаются ли карты
      - path: data.result[].hidden_on_map
        api_type: bool
        required: false
        description: Скрыта ли на карте
      - path: data.result[].active
        api_type: bool
        required: false
        description: Активна ли ТО
      - path: data.result[].POIType
        api_type: string
        required: false
        description: Код типа ТО
      - path: data.result[].Terminals[].id
        api_type: string
        required: true
        description: Идентификатор терминала
      - path: data.result[].Terminals[].active
        api_type: bool
        required: true
        description: Статус терминала (true – включен, false – выключен)
      - path: data.result[].Terminals[].name
        api_type: string
        required: true
        description: Наименование терминала
      - path: data.result[].Terminals[].status
        api_type: string
        required: true
        description: Статус терминала
      - path: data.result[].Terminals[].type
        api_type: string
        required: true
        description: Тип терминала
      - path: data.result[].Terminals[].connectionType
        api_type: string
        required: true
        description: Способ подключения
      - path: data.result[].Terminals[].number
        api_type: string
        required: true
        description: Номер терминала
      - path: data.result[].Address.track_id
        api_type: string
        required: false
        description: Номер трассы
      - path: data.result[].Address.kmRoad
        api_type: string
        required: false
        description: Километр
      - path: data.result[].Address.roadSide
        api_type: string
        required: false
        description: Сторона дороги
      - path: data.result[].Address.city
        api_type: string
        required: true
        description: Город
      - path: data.result[].Address.street
        api_type: string
        required: false
        description: Улица
      - path: data.result[].Address.house
        api_type: string
        required: false
        description: Дом
      - path: data.result[].Address.building
        api_type: string
        required: false
        description: Строение
      - path: data.result[].Address.phone
        api_type: string
        required: false
        description: Телефон
      - path: data.result[].Address.fax
        api_type: string
        required: false
        description: Факс
      - path: data.result[].Prices[].ID
        api_type: string
        required: true
        description: ID цены
      - path: data.result[].Prices[].GasStationID
        api_type: string
        required: true
        description: ID торговой точки
      - path: data.result[].Prices[].GoodsCode
        api_type: string
        required: true
        description: Товары, описание товаров можно посмотреть в справочнике GoodsCode
      - path: data.result[].Prices[].Price
        api_type: string
        required: true
        description: Цена
      - path: data.result[].Prices[].Currency
        api_type: string
        required: true
        description: Валюта
      - path: data.result[].Prices[].DateTo
        api_type: string
        required: true
        description: Дата действия цены
      - path: data.result[].Prices[].DateFrom
        api_type: string
        required: true
        description: Дата обновления цены
      - path: data.result[].working_time[].Weekday
        api_type: string
        required: true
        description: День недели или режим работы (Monday + Round-The-Clock - круглосуточно, Everyday - каждый день)
      - path: data.result[].working_time[].StartWorkTime
        api_type: string
        required: false
        description: Время открытия
      - path: data.result[].working_time[].FinishWorkTime
        api_type: string
        required: false
        description: Время закрытия
      fixture: null
      fixture_status: unavailable
      fixture_note: no-json

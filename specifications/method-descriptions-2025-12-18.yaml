  title: Список топливных карт (Процессинг)
  roles:
  - Администратор
  - Чтение
  description: 'Получение списка карт с данными (например: комментарий, дата последнего использования,
    минимальное время между транзакциями, тип продукта - лимитная или ЭК).'
- external_code: cards_group
  group: Топливные карты — Cards
  title: Список топливных карт по группе карт
  roles:
  - Администратор

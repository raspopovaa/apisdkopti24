  title: Заказ отчета на email и по ссылке (v.2)
  roles:
  - Администратор
  - Чтение
  description: Новый метод, предоставляет возможность заказа любого из доступных видов отчетов. Список
    доступных видов отчетов предоставляется методом «Список доступных отчетов (v.2)». Ограничения отправки
    отчетов на Email составляет 15мб. Новые транзакции доступны спустя 1 – 2 часа (время постирования
    в системе) после их проведения. Указанное время является примерным и может быть увеличено в отдельных
    случаях.
- external_code: reports_jobs

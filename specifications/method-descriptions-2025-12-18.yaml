# Описания методов API для документации, сконвертированные из «Свода методов API
# с описанием» от 18.12.2025. Технические поля метода — в api-methods.yaml.
schema_version: 1
source:
  title: Свод методов API с описанием
  date: '2025-12-18'
  original_format: xlsx
  sheet: Лист1
  note: Группа, название, роли и описание методов. Маршрут, HTTP-метод, доступность на DEMO и тарификация
    берутся из api-methods.yaml, сконвертированного из того же документа; при конвертации они сверены
    построчно, расхождений нет. Исправлена только орфография. Лист 2 документа — ранняя редакция без release,
    poi и filters. Оригинал в репозитории не хранится.
methods:
- external_code: authuser
  group: Пользователь, учетная запись
  title: Авторизация пользователя
  roles:
  - Администратор
  - Чтение
  description: Метод используется для авторизации в системе через API. При выполнении запроса пользователь
    получает идентификатор активной сессии, который используется во всех последующих запросах для возможности
    их выполнения. Суть метода заключается в том же, что и авторизация в ЛК (т.е. получение прав на работу
    в интерфейсе).
- external_code: logoff
  group: Пользователь, учетная запись
  title: Деавторизация пользователя
  roles:
  - Администратор
  - Чтение
  description: Метод делает ранее полученную сессию (на этапе авторизации) неактивной. Другими словами,
    пользователь "выходит" из профиля (аналогично кнопке выхода в ЛК).
- external_code: info
  group: Пользователь, учетная запись
  title: Статистика
  roles:
  - Администратор
  - Чтение
  description: Получение статистических данных по вызовам всех методов.
- external_code: getpartcontractdata

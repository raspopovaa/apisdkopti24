- external_code: reports_jobs_file
  group: Запрос отчета — Reports
  title: Генерация файла отчета (v.2)
  roles:
  - Администратор
  - Чтение
  description: Метод предоставляет возможность получить содержимое файла заказанного ранее отчета. В запросе
    по данному методу передается идентификатор ранее заказанного отчета, в ответе возвращается содержимое
    файла, которое используется для формирования файла отчета. Получение файла отчета в необходимом клиенту
    формате (pdf, xlsx, csv, xml и другие).
- external_code: reports
  group: Запрос отчета — Reports
  title: Запрос транзакционного отчета за период на email и по ссылке
  roles:
  - Администратор
  - Чтение
  description: Устаревший метод, т.к. позволяет заказать только транзакционный отчет по договору на email.
    Ограничения отправки отчетов на Email составляет 15мб. Новые транзакции доступны спустя 1 – 2 часа
    (время постирования в системе) после их проведения. Указанное время является примерным и может быть
    увеличено в отдельных случаях.
- external_code: getreportjoblist
  group: Запрос отчета — Reports
  title: Список ранее заказанных отчетов по ссылке
  roles:
  - Администратор
  - Чтение
  description: Метод предоставляет доступ к идентификаторам ранее заказанных транзакционных отчетов, которые
    используются для генерации файлов отчетов, то есть только информацию о ранее заказанных отчетах, но
    не сами файлы отчетов. После заказа можно запросить все транзакционные отчеты, заказанные по ссылке
    в последние 7 дней и повторно их скачать.
- external_code: getreportfile
  group: Запрос отчета — Reports
  title: Генерация файла отчета
  roles:
  - Администратор
  - Чтение
  description: Метод предоставляет возможность получить содержимое файла заказанного ранее транзакционного
    отчета. В запросе по данному методу передается идентификатор ранее заказанного отчета, в ответе возвращается
    содержимое файла, которое используется для формирования файла отчета. Получение файла отчета в необходимом
    клиенту формате (pdf, xlsx, csv, xml и другие).

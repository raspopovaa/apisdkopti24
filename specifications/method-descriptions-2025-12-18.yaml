  title: Данные по договору
  roles:
  - Администратор
  - Чтение
  description: Получение данных по договору (статус, менеджер, доступный остаток, расход в текущем месяце,
    число карт и пр.).
- external_code: getpayments
  group: Договор — Contract
  title: Платежи по договору
  roles:
  - Администратор
  - Чтение
  description: Получение данных о платежах.
- external_code: documents_get

  title: Список транзакций по договору (v.2)
  roles:
  - Администратор
  - Чтение
  description: Получение списка транзакций по договору за выбранный период не больше месяца. Новые транзакции
    доступны спустя 1 – 2 часа (время постирования в системе) после их проведения. Указанное время является
    примерным и может быть увеличено в отдельных случаях.
- external_code: transaction_detail
  group: Транзакции — Transactions
  title: Данные по транзакции
  roles:
  - Администратор
  - Чтение
  description: Метод возвращает данные по конкретной транзакции (дата, время, продукт, цена, количество,
    сумма и пр.) по её ID.
- external_code: card_transactions

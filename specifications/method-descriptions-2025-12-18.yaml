  title: Список первичных документов по договору за период
  roles:
  - Администратор
  description: Получение списка первичных документов (номер документа, дата, сумма, НДС, номер договора
    и пр.).
- external_code: documents_post
  group: Договор — Contract
  title: Заказ первичных документов на почту
  roles:
  - Администратор
  description: Заказ первичных документов по ID документа на указанные email-адреса (до 5 адресов).
- external_code: order_cards
  group: Договор — Contract
  title: Заказ топливных карт
  roles:
  - Администратор
  description: Заказ необходимого количества топливных карт в определенном офисе продаж.
- external_code: invoice
  group: Договор — Contract
  title: Заказ счета на оплату
  roles:
  - Администратор
  - Чтение
  description: Заказ счета на оплату.
- external_code: invoices
  group: Договор — Contract
  title: Счета на оплату
  roles:
  - Администратор
  - Чтение
  description: Получение списка счетов на оплату.
- external_code: cards_cache
  group: Топливные карты — Cards
  title: Список карт договора (v.2)
  roles:
  - Администратор
  - Чтение
  description: 'Новый метод получения списка карт с данными (например: название группы карт, статус, комментарий,
    существует ли МПК).'

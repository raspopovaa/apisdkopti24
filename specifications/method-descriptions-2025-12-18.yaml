  title: Установить комментарий на топливную карту
  roles:
  - Администратор
  description: Установка комментария на карту.
- external_code: cards_verify_pin
  group: Топливные карты — Cards
  title: Запрос одноразового кода для сброса попыток ввода PIN карты
  roles:
  - Администратор
  description: Данный метод позволяет инициировать запрос на сброс попыток некорректного ввода PIN-кода
    карты. Вам будет отправлено письмо с кодом подтверждения на почту, которая привязана к вашей учетной
    записи. Данный код нужно ввести в метод "Подтверждение сброса попыток некорректного ввода PIN - кода
    карты" для завершения операции сброса попыток.
- external_code: cards_reset_pin
  group: Топливные карты — Cards
  title: Подтверждение сброса попыток некорректного ввода PIN - кода карты
  roles:
  - Администратор
  description: Данный метод позволяет завершить операцию со сбросом попыток некорректного ввода PIN –
    кода пластиковой топливной карты на АЗС. Код подтверждения будет отправлен на почту, которая привязана
    к вашей учетной записи.
- external_code: setcardproduct

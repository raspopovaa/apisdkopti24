  description: Перевод денежных средств с кошелька на договор.
- external_code: transactions
  group: Транзакции — Transactions
  title: Список последних транзакций по договору и карте
  roles:
  - Администратор
  - Чтение
  description: Получение списка последних 30 транзакций по договору или по карте (устаревший метод). Данные
    о транзакциях поступают в реальном времени, однако в этом случае будут возвращаться все данные – информация
    о транзакциях в их текущем статусе (например, транзакция может находиться в статусе обработки).
- external_code: contract_transactions

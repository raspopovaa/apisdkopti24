schema_version: 1
source:
  title: API VIP specification
  note: >-
    Описания дополняют Python-сигнатуры и модели SDK. QR/MPC-операции сверены
    со спецификацией сервиса API QR версии 1.0.4 от 30.05.2024.

domains:
  auth:
    summary: Авторизация и сведения о сессии
    description: Методы авторизации пользователя, завершения сессии и получения сведений об учетной записи.
  card_groups:
    summary: Группы топливных карт
    description: Создание, изменение и удаление групп карт, а также управление составом группы.
  cards:
    summary: Топливные карты
    description: Получение карт и их реквизитов, блокировка, комментарии, водители и операции с PIN.
  contracts:
    summary: Договоры и документы
    description: Данные договора, платежи, счета, документы и заказ топливных карт.
  dictionaries:
    summary: Справочники и торговые точки
    description: Справочные значения, список АЗС и фильтры торговых точек.
  ewallet:
    summary: Электронный кошелек
    description: Переводы между договором и картой, а также выбор продуктовой схемы карты.
  final_prices:
    summary: Расчет итоговой стоимости
    description: Проверка возможности покупки и расчет итоговых цен по карте.
  invites:
    summary: Приглашения пользователей
    description: Создание, просмотр, повторная отправка, продление и удаление приглашений.
  limits:
    summary: Продуктовые лимиты
    description: Получение, установка и удаление продуктовых лимитов топливной карты.
  region_limits:
    summary: Региональные ограничения
    description: Получение, установка и удаление ограничений по регионам обслуживания.
  reports:
    summary: Отчеты
    description: Заказ отчетов, просмотр заданий и скачивание сформированных файлов.
  restrictions:
    summary: Ограничители обслуживания
    description: Управление временными, количественными и иными ограничителями топливных карт.
  templates:
    summary: Шаблоны виртуальных карт
    description: Управление шаблонами, лимитами, ограничителями и географическими ограничениями.
  transactions:
    summary: Транзакции
    description: Получение списка транзакций и детальной информации по отдельной операции.
  users:
    summary: Пользователи и водители
    description: Управление пользователями договора и привязками пользователей к картам.
  virtual_cards:
    summary: Виртуальные карты и QR
    description: Выпуск виртуальных карт, управление МПК и формирование платёжных строк для QR-кодов.

parameters:
  api_version: Версия API. Обычно определяется SDK автоматически.
  contract_id: Идентификатор договора. Для части методов может быть получен из активного контекста SDK.
  card_id: Идентификатор топливной карты.
  card_ids: Список идентификаторов топливных карт.
  group_id: Идентификатор группы топливных карт.
  user_id: Идентификатор пользователя.
  invite_id: Идентификатор приглашения.
  template_id: Идентификатор шаблона.
  transaction_id: Идентификатор транзакции.
  report_id: Идентификатор отчета.
  job_id: Идентификатор задания формирования отчета.
  page: Номер страницы результата.
  onpage: Количество элементов на странице.
  sort: Выражение сортировки. Префикс «-» задает сортировку по убыванию.
  q: Строка полнотекстового поиска.

operations:
  auth_user:
    summary: Авторизовать пользователя и открыть сессию SDK.
    response: Возвращает типизированные данные авторизации, включая идентификатор сессии и доступные договоры.
  get_cards_v1:
    summary: Получить список топливных карт через API v1.
  get_cards_v2:
    summary: Получить постраничный список топливных карт договора через API v2.
  get_card_detail:
    summary: Получить детальную информацию о топливной карте.
  block_card:
    summary: Заблокировать или разблокировать одну или несколько топливных карт.
  get_transactions_v2:
    summary: Получить транзакции договора за заданный период.
  get_transaction_detail:
    summary: Получить детальную информацию об одной транзакции.
  set_limit:
    summary: Установить или изменить продуктовый лимит карты.
  remove_limit:
    summary: Удалить продуктовый лимит карты.
  order_report:
    summary: Создать задание на формирование отчета.
  download_report_file:
    summary: Скачать файл сформированного отчета.
    response: Возвращает бинарное содержимое файла отчета.
  get_mpc_qr_list:
    summary: Получить список выпущенных мобильных профилей карт.
  generate_payment_qr:
    summary: Сформировать одноразовую платёжную строку для QR-кода.
    response: Возвращает BER-TLV строку, срок её действия и счётчики МПК.
  init_mpc:
    summary: Начать выпуск мобильного профиля карты.
  confirm_mpc:
    summary: Подтвердить выпуск МПК кодом из SMS.
  update_mpc:
    summary: Перевыпустить ключи МПК и при необходимости изменить PIN.
  delete_mpc:
    summary: Удалить мобильный профиль карты.
  reset_mpc:
    summary: Сбросить блокировку выпуска или оплаты по МПК.

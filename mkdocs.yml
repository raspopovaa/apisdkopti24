site_name: apisdkopti24 — Python SDK для Opti24 API
site_description: Асинхронный Python SDK для Opti24 API — API топливных карт АЗС (ОПТИ 24)
site_url: https://raspopovaa.github.io/apisdkopti24/
repo_url: https://github.com/raspopovaa/apisdkopti24
repo_name: raspopovaa/apisdkopti24
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

not_in_nav: |
  data-types/**/*.md
  RELEASE.md

theme:
  name: material
  language: ru
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему

plugins:
  - search:
      lang:
        - ru
        - en
  - mike:
      canonical_version: latest
      alias_type: redirect

extra:
  version:
    provider: mike
    default: latest
    alias: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Главная: index.md
  - Начало работы:
      - Установка и запуск: getting-started.md
      - Конфигурация: configuration.md
      - Типовые сценарии: scenarios.md
      - Оплата по QR-коду: qr-payments.md
      - Договоры и ограничения: section-2b.md
      - Ошибки и повторы: errors.md
  - Учебные примеры:
      - examples/index.md
      - Авторизация:
          - examples/auth/index.md
          - 'Авторизация и выбор договора': examples/auth/auth_user.md
          - 'Статистика обращений к API': examples/auth/get_info.md
          - 'Завершение сессии': examples/auth/logoff.md
      - Группы карт:
          - examples/card_groups/index.md
          - 'Список групп карт': examples/card_groups/get_card_groups.md
          - 'Создание и переименование группы карт': examples/card_groups/set_card_group.md
          - 'Добавление и удаление карт в группе': examples/card_groups/set_cards_to_group.md

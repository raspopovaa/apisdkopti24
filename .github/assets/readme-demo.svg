<clipPath id="c0"><rect x="24" y="52" height="24" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.0214;0.0643;0.9429;0.9714;1" values="0;0;121;121;121;0"/></rect></clipPath><g clip-path="url(#c0)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.9429;0.9714;1" values="1;1;0;0"/><text x="28" y="70" xml:space="preserve"><tspan fill="#7d8590"># example.py</tspan></text></g><clipPath id="c1"><rect x="24" y="76" height="24" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.0714;0.1500;0.9429;0.9714;1" values="0;0;367;367;367;0"/></rect></clipPath><g clip-path="url(#c1)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.9429;0.9714;1" values="1;1;0;0"/><text x="28" y="94" xml:space="preserve"><tspan fill="#c792ea">async with </tspan><tspan fill="#82aaff">APIClient</tspan><tspan fill="#e6edf3">(settings=settings,</tspan></text></g><clipPath id="c2"><rect x="24" y="100" height="24" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.1571;0.2429;0.9429;0.9714;1" values="0;0;604;604;604;0"/></rect></clipPath><g clip-path="url(#c2)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.9429;0.9714;1" values="1;1;0;0"/><text x="28" y="118" xml:space="preserve"><tspan fill="#e6edf3">                     credentials_provider=credentials) </tspan><tspan fill="#c792ea">as </tspan><tspan fill="#e6edf3">client:</tspan></text></g><clipPath id="c3"><rect x="24" y="124" height="24" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.2571;0.3214;0.9429;0.9714;1" values="0;0;312;312;312;0"/></rect></clipPath><g clip-path="url(#c3)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.9429;0.9714;1" values="1;1;0;0"/><text x="28" y="142" xml:space="preserve"><tspan fill="#c792ea">    await </tspan><tspan fill="#e6edf3">client.auth.</tspan><tspan fill="#82aaff">auth_user</tspan><tspan fill="#e6edf3">()</tspan></text></g><clipPath id="c4"><rect x="24" y="148" height="24" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.3357;0.4286;0.9429;0.9714;1" values="0;0;567;567;567;0"/></rect></clipPath><g clip-path="url(#c4)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.9429;0.9714;1" values="1;1;0;0"/><text x="28" y="166" xml:space="preserve"><tspan fill="#e6edf3">    cards = </tspan><tspan fill="#c792ea">await </tspan><tspan fill="#e6edf3">client.cards.</tspan><tspan fill="#82aaff">get_cards_v2</tspan><tspan fill="#e6edf3">(page=</tspan><tspan fill="#f78c6c">1</tspan><tspan fill="#e6edf3">, onpage=</tspan><tspan fill="#f78c6c">5</tspan><tspan fill="#e6edf3">)</tspan></text></g><clipPath id="c5"><rect x="24" y="172" height="24" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.4429;0.5143;0.9429;0.9714;1" values="0;0;422;422;422;0"/></rect></clipPath><g clip-path="url(#c5)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.9429;0.9714;1" values="1;1;0;0"/><text x="28" y="190" xml:space="preserve"><tspan fill="#82aaff">    print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#c3e88d">&quot;Карт найдено:&quot;</tspan><tspan fill="#e6edf3">, cards.total_count)</tspan></text></g><clipPath id="c7"><rect x="24" y="220" height="24" width="0"><animate attributeName="width" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.5571;0.6143;0.9429;0.9714;1" values="0;0;185;185;185;0"/></rect></clipPath><g clip-path="url(#c7)"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.9429;0.9714;1" values="1;1;0;0"/><text x="28" y="238" xml:space="preserve"><tspan fill="#79c0ff">$ </tspan><tspan fill="#e6edf3">python example.py</tspan></text></g><text x="28" y="262" opacity="0" xml:space="preserve"><tspan fill="#e6edf3">Карт найдено: </tspan><tspan fill="#f78c6c">12</tspan><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6571;0.9714" values="0;1;0"/></text><text x="28" y="286" opacity="0" xml:space="preserve"><tspan fill="#7ee787">✓ </tspan><tspan fill="#7d8590">сессия, договор и лимит частоты — под контролем SDK</tspan><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7000;0.9714" values="0;1;0"/></text>

 values="0;0;718;718;718;0"/></rect></clipPath><g clip-path="url(#c1)"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.9444;0.9722;1.0000" values="1;1;0;0"/><text x="28" y="93" xml:space="preserve"><tspan fill="#ff7b72">async with </tspan><tspan fill="#d2a8ff">APIClient</tspan><tspan fill="#e6edf3">(settings=settings, credentials_provider=credentials) </tspan><tspan fill="#ff7b72">as </tspan><tspan fill="#e6edf3">client:</tspan></text></g><clipPath id="c2"><rect x="24" y="99" height="23" width="0"><animate attributeName="width" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.1500;0.2000;0.9444;0.9722;1.0000" values="0;0;456;456;456;0"/></rect></clipPath><g clip-path="url(#c2)"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.9444;0.9722;1.0000" values="1;1;0;0"/><text x="28" y="116" xml:space="preserve"><tspan fill="#e6edf3">    cards = </tspan><tspan fill="#ff7b72">await </tspan><tspan fill="#e6edf3">client.cards.</tspan><tspan fill="#d2a8ff">get_cards_v2</tspan><tspan fill="#e6edf3">(onpage=5)</tspan></text></g><clipPath id="c3"><rect x="24" y="122" height="23" width="0"><animate attributeName="width" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.2111;0.2611;0.9444;0.9722;1.0000" values="0;0;422;422;422;0"/></rect></clipPath><g clip-path="url(#c3)"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.9444;0.9722;1.0000" values="1;1;0;0"/><text x="28" y="139" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#d2a8ff">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">"Карт на договоре:"</tspan><tspan fill="#e6edf3">, cards.total_count)</tspan></text></g><clipPath id="c4"><rect x="24" y="158.8" height="23" width="0"><animate attributeName="width" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.2778;0.3000;0.9444;0.9722;1.0000" values="0;0;169;169;169;0"/></rect></clipPath><g clip-path="url(#c4
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="432" viewBox="0 0 820 432" role="img" aria-label="Демо apisdkopti24: чтение списка карт после ответа 509 SDK повторяет с паузой, а блокировку карты после ответа шлюза 504 не повторяет, помечает исход неизвестным и пишет событие аудита"><title>apisdkopti24 — повтор только там, где он безопасен</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:14px}</style><defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d333b"/><stop offset="1" stop-color="#22272e"/></linearGradient></defs><rect x="0.5" y="0.5" width="819" height="431" rx="12" fill="#0d1117" stroke="#30363d"/><path d="M0.5 12.5a12 12 0 0 1 12-12h795a12 12 0 0 1 12 12v24h-819z" fill="url(#bar)"/><circle cx="24" cy="19" r="6" fill="#ff5f57"/><circle cx="44" cy="19" r="6" fill="#febc2e"/><circle cx="64" cy="19" r="6" fill="#28c840"/><text x="410.0" y="24" text-anchor="middle" fill="#7d8590" style="font-size:13px">apisdkopti24 · повтор только там, где он безопасен</text><line x1="24" y1="157.15" x2="796" y2="157.15" stroke="#30363d" stroke-dasharray="4 4" opacity="0"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.2273;0.2364;0.9455;0.9727;1.0000" values="0;0;1;1;0;0"/></line><clipPath id="c0"><rect x="24" y="53" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.0136;0.0364;0.9455;0.9727;1.0000" values="0;0;109;109;109;0"/></rect></clipPath><g clip-path="url(#c0)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="70" xml:space="preserve"><tspan fill="#7d8590"># example.py</tspan></text></g><clipPath id="c1"><rect x="24" y="76" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.0455;0.1091;0.9455;0.9727;1.0000" values="0;0;718;718;718;0"/></rect></clipPath><g clip-path="url(#c1)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="93" xml:space="preserve"><tspan fill="#ff7b72">async with </tspan><tspan fill="#d2a8ff">APIClient</tspan><tspan fill="#e6edf3">(settings=settings, credentials_provider=credentials) </tspan><tspan fill="#ff7b72">as </tspan><tspan fill="#e6edf3">client:</tspan></text></g><clipPath id="c2"><rect x="24" y="99" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.1182;0.1591;0.9455;0.9727;1.0000" values="0;0;523;523;523;0"/></rect></clipPath><g clip-path="url(#c2)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="116" xml:space="preserve"><tspan fill="#e6edf3">    cards = </tspan><tspan fill="#ff7b72">await </tspan><tspan fill="#e6edf3">client.cards.</tspan><tspan fill="#d2a8ff">get_cards_v2</tspan><tspan fill="#e6edf3">(page=1, onpage=5)</tspan></text></g><clipPath id="c3"><rect x="24" y="122" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.1682;0.2136;0.9455;0.9727;1.0000" values="0;0;650;650;650;0"/></rect></clipPath><g clip-path="url(#c3)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="139" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#ff7b72">await </tspan><tspan fill="#e6edf3">client.cards.</tspan><tspan fill="#d2a8ff">block_card</tspan><tspan fill="#e6edf3">(card_ids=[cards.result[0].id], block=</tspan><tspan fill="#ff7b72">True</tspan><tspan fill="#e6edf3">)</tspan></text></g><clipPath id="c4"><rect x="24" y="159" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.2364;0.2545;0.9455;0.9727;1.0000" values="0;0;169;169;169;0"/></rect></clipPath><g clip-path="url(#c4)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="176" xml:space="preserve"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e6edf3">python example.py</tspan></text></g><clipPath id="c5"><rect x="24" y="182" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.2727;0.2886;0.9455;0.9727;1.0000" values="0;0;659;659;659;0"/></rect></clipPath><g clip-path="url(#c5)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="199" xml:space="preserve"><tspan fill="#e3b341">  ↻ </tspan><tspan fill="#e6edf3">GET v2/cards → 509 лимит частоты      </tspan><tspan fill="#7d8590">пауза 0,5 с: чтение можно повторить</tspan></text></g><clipPath id="c6"><rect x="24" y="205" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.3182;0.3341;0.9455;0.9727;1.0000" values="0;0;591;591;591;0"/></rect></clipPath><g clip-path="url(#c6)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="222" xml:space="preserve"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">GET v2/cards → 200, разобран в модель </tspan><tspan fill="#7d8590">CardsV2Response, попыток: 2</tspan></text></g><clipPath id="c7"><rect x="24" y="228" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.3818;0.3977;0.9455;0.9727;1.0000" values="0;0;557;557;557;0"/></rect></clipPath><g clip-path="url(#c7)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="245" xml:space="preserve"><tspan fill="#f85149">  ✗ </tspan><tspan fill="#e6edf3">POST v1/blockCard → 504               </tspan><tspan fill="#7d8590">шлюз не дождался ответа</tspan></text></g><clipPath id="c8"><rect x="24" y="251" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.4273;0.4432;0.9455;0.9727;1.0000" values="0;0;676;676;676;0"/></rect></clipPath><g clip-path="url(#c8)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="268" xml:space="preserve"><tspan fill="#f85149">    </tspan><tspan fill="#e6edf3">не повторено: изменение могло пройти  </tspan><tspan fill="#7d8590">ServerError, reason=&quot;outcome_unknown&quot;</tspan></text></g><clipPath id="c9"><rect x="24" y="274" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.4727;0.4886;0.9455;0.9727;1.0000" values="0;0;616;616;616;0"/></rect></clipPath><g clip-path="url(#c9)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="291" xml:space="preserve"><tspan fill="#2dd4bf">  → </tspan><tspan fill="#e6edf3">сначала проверьте состояние чтением   </tspan><tspan fill="#7d8590">get_card_detail, затем решайте</tspan></text></g><clipPath id="c10"><rect x="24" y="304" height="23" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.5364;0.5773;0.9455;0.9727;1.0000" values="0;0;650;650;650;0"/></rect></clipPath><g clip-path="url(#c10)"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.9455;0.9727;1.0000" values="1;1;0;0"/><text x="28" y="321" xml:space="preserve"><tspan fill="#e3b341">audit.jsonl </tspan><tspan fill="#7d8590">← </tspan><tspan fill="#7d8590">{&quot;operation&quot;: &quot;block_card&quot;, &quot;error_reason&quot;: &quot;outcome_unknown&quot;}</tspan></text></g><line x1="0.5" y1="380" x2="819.5" y2="380" stroke="#30363d"/><text x="28.00" y="402" fill="#2dd4bf">89 операций</text><text x="142.95" y="402" fill="#7d8590">·</text><text x="173.40" y="402" fill="#2dd4bf">16 сервисов</text><text x="288.35" y="402" fill="#7d8590">·</text><text x="318.80" y="402" fill="#7d8590">повтор по каталогу операций</text><text x="568.95" y="402" fill="#7d8590">·</text><text x="599.40" y="402" fill="#7d8590">аудит без секретов</text></svg>
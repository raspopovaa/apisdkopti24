<svg xmlns="http://www.w3.org/2000/svg" width="900" height="672" viewBox="0 0 900 672" role="img" aria-label="Путь запроса get_cards_v2 через SDK: проверка параметров в сервисе, бюджет и аудит, сессия с одним authUser, подготовка запроса по OperationSpec, лимит частоты и повторы только для безопасных операций, HTTP-запрос через httpx, проверка HTTP-статуса и status.code с одной повторной авторизацией при 401, разбор ответа в модель и итоговое событие аудита"><title>Как проходит запрос к API</title><style>
@keyframes walk {
  0%,8% { transform: translateY(0); opacity: 1 }
  10%,18% { transform: translateY(70px) }
  20%,28% { transform: translateY(140px) }
  30%,38% { transform: translateY(210px) }
  40%,48% { transform: translateY(280px) }
  50%,58% { transform: translateY(350px) }
  60%,68% { transform: translateY(420px) }
  70%,80% { transform: translateY(490px); opacity: 1 }
  84%,100% { transform: translateY(490px); opacity: 0 }
}
@keyframes lit { 0%,8% { fill: #2dd4bf } 10%,100% { fill: #0d1117 } }
@keyframes litnum { 0%,8% { fill: #0d1117 } 10%,100% { fill: #2dd4bf } }
@keyframes branch { 0%,8% { stroke-width: 2.5; opacity: 1 } 10%,100% { stroke-width: 1; opacity: .55 } }
@keyframes flow { to { stroke-dashoffset: -14 } }
@keyframes done { 0%,78% { opacity: .45 } 84%,96% { opacity: 1 } 100% { opacity: .45 } }
.cursor { animation: walk 12s ease-in-out infinite }
.num { animation: lit 12s linear infinite }
.numtext { animation: litnum 12s linear infinite }
.branch { animation: branch 12s linear infinite; opacity: .55 }
.branch-line { animation: flow .8s linear infinite }
.done { animation: done 12s linear infinite }
@media (prefers-reduced-motion: reduce) {
  .cursor, .num, .numtext, .branch, .branch-line, .done { animation: none }
  .cursor { display: none }
  .branch, .done { opacity: 1 }
}
</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker><marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker></defs><rect x="0.5" y="0.5" width="899" height="671" rx="12" fill="#0d1117" stroke="#30363d"/><text x="24" y="32" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600">Как проходит запрос к API</text><text x="876" y="32" text-anchor="end" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">путь одного вызова через код SDK</text><text x="24" y="60" text-anchor="start" fill="#2dd4bf" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px;font-weight:600">await client.cards.get_cards_v2(onpage=5)</text><rect x="24" y="76" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:0.0s" cx="50" cy="105.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="109.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:0.0s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">1</text><text x="76" y="99" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600">Метод сервиса</text><text x="622" y="99" text-anchor="end" fill="#d2a8ff" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:400">services/cards.py</text><text x="76" y="119" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">CardsV2Query проверяет параметры до входа и отправки; договор — из сессии.</text><line x1="50" y1="134" x2="50" y2="145" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="24" y="146" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:1.2s" cx="50" cy="175.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="179.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:1.2s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">2</text><text x="76" y="169" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600">Бюджет и аудит</text><text x="622" y="169" text-anchor="end" fill="#d2a8ff" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:400">executor.py</text><text x="76" y="189" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">Общий срок по timeout-классу операции и лимит попыток; старт события аудита.</text><line x1="50" y1="204" x2="50" y2="215" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="24" y="216" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:2.4s" cx="50" cy="245.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="249.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:2.4s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">3</text><text x="76" y="239" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600">Сессия</text><text x="622" y="239" text-anchor="end" fill="#d2a8ff" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:400">session.py · authentication.py</text><text x="76" y="259" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">Если сессии нет — один authUser на все параллельные вызовы.</text><line x1="50" y1="274" x2="50" y2="285" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="24" y="286" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:3.6s" cx="50" cy="315.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="319.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:3.6s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">4</text><text x="76" y="309" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600">Подготовка запроса</text><text x="622" y="309" text-anchor="end" fill="#d2a8ff" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:400">executor.py · endpoints.py</text><text x="76" y="329" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">OperationSpec даёт GET v2/cards; заголовки api_key, session_id, contract_id.</text><line x1="50" y1="344" x2="50" y2="355" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="24" y="356" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:4.8s" cx="50" cy="385.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="389.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:4.8s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">5</text><text x="76" y="379" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600">Слот, лимит частоты, попытка</text><text x="622" y="379" text-anchor="end" fill="#d2a8ff" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:400">resilience.py</text><text x="76" y="399" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">Слот из 20 одновременных, 1 запрос/с по умолчанию, попытка из бюджета.</text><line x1="636" y1="385.0" x2="656" y2="385.0" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4 3" class="branch-line" marker-end="url(#arrow-warn)"/><rect class="branch" style="animation-delay:4.8s" x="658" y="356" width="218" height="58" rx="8" fill="#161b22" stroke="#e3b341"/><text x="670" y="375" text-anchor="start" fill="#e3b341" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:600">429 · 509 · сбой сети</text><text x="670" y="391" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400">пауза и повтор, если каталог</text><text x="670" y="406" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400">разрешает повтор операции</text><line x1="50" y1="414" x2="50" y2="425" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="24" y="426" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:6.0s" cx="50" cy="455.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="459.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:6.0s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">6</text><text x="76" y="449" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600">HTTP-запрос</text><text x="622" y="449" text-anchor="end" fill="#d2a8ff" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:400">transport.py</text><text x="76" y="469" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">httpx без редиректов; timeout — остаток срока; тело читается с пределом.</text><line x1="50" y1="484" x2="50" y2="495" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="24" y="496" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:7.2s" cx="50" cy="525.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="529.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:7.2s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">7</text><text x="76" y="519" text-anchor="start" fill="#e6edf3" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600">Проверка ответа</text><text x="622" y="519" text-anchor="end" fill="#d2a8ff" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:400">response.py · errors.py</text><text x="76" y="539" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:400">HTTP-статус и status.code в теле; ошибка → типизированное исключение.</text><line x1="636" y1="525.0" x2="656" y2="525.0" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="4 3" class="branch-line" marker-end="url(#arrow-err)"/><rect class="branch" style="animation-delay:7.2s" x="658" y="496" width="218" height="58" rx="8" fill="#161b22" stroke="#ff7b72"/><text x="670" y="515" text-anchor="start" fill="#ff7b72" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;font-weight:600">401 notAuthenticated</text><text x="670" y="531" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400">одна повторная авторизация</text><text x="670" y="546" text-anchor="start" fill="#8b949e" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400">и повтор запроса</text><line x1="50" y1="554" x2="50" y2="565" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/><rect x="24" y="566" width="612" height="58" rx="8" fill="#161b22" stroke="#30363d"/><circle class="num" style="animation-delay:8.4s" cx="50" cy="595.0" r="13" fill="#0d1117" stroke="#2dd4bf"/><text class="numtext" x="50" y="599.5" text-anchor="middle" fill="#2dd4bf" style="animation-delay:8.4s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700">8</text><text x="76" 
name: Publish TestPyPI and PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install locked build dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/project/apisdkopti24/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1.0" "pydantic>=2.13.4,<3.0"

      - name: Install exact version from TestPyPI
        env:
          PACKAGE_VERSION: "3.3.11"
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install --disable-pip-version-check \
              --index-url https://test.pypi.org/simple/ \
              --no-deps "apisdkopti24==$PACKAGE_VERSION"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 15
          done
          cd /tmp
          python -c "from apisdkopti24 import APIClient, __version__; assert __version__ == '$PACKAGE_VERSION'; print(__version__, APIClient.__name__)"

  publish-pypi:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: pypi
      url: https://pypi.org/project/apisdkopti24/
    permissions:
      id-token: write

    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish the reviewed artifact to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

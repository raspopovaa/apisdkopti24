name: Publish TestPyPI and PyPI

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "После проверки на TestPyPI опубликовать тот же пакет в PyPI"
        type: boolean
        default: false
      promote_run_id:
        description: "Номер прошлого запуска: опубликовать в PyPI его пакет, уже проверенный на TestPyPI, без пересборки"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.promote_run_id == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Сборка исполняет код репозитория: токен не должен оставаться в .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked build dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests on the release commit
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Read package version from the built wheel
        id: version
        run: |
          version="$(python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          wheels = list(pathlib.Path("dist").glob(f"apisdkopti24-{version}-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Ожидался один wheel версии {version}, найдено: {wheels}")
          print(version)
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish:
    if: github.ref == 'refs/heads/main' && inputs.promote_run_id == ''
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/project/apisdkopti24/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Уже опубликованная версия должна останавливать релиз: иначе smoke-тест
          # проверил бы старый пакет с TestPyPI, а в PyPI ушла бы новая сборка.
          skip-existing: false

  smoke-test:
    if: github.ref == 'refs/heads/main' && inputs.promote_run_id == ''
    runs-on: ubuntu-latest
    needs: [build, publish]

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Install runtime dependencies from PyPI
        # Зависимости берутся из метаданных собранного wheel, а не из списка в
        # workflow, и ставятся из PyPI; сам пакет — отдельно из TestPyPI.
        run: |
          python - <<'PY' > requirements-smoke.txt
          import pathlib
          import zipfile
          from email.parser import Parser

          wheel = next(pathlib.Path("dist").glob("apisdkopti24-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              name = next(item for item in archive.namelist() if item.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(archive.read(name).decode("utf-8"))
          for requirement in metadata.get_all("Requires-Dist") or []:
              if "extra ==" not in requirement:
                  print(requirement)
          PY
          cat requirements-smoke.txt
          python -m pip install --disable-pip-version-check -r requirements-smoke.txt

      - name: Install exact version from TestPyPI
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install --disable-pip-version-check \
              --index-url https://test.pypi.org/simple/ \
              --no-deps --no-cache-dir "apisdkopti24==$PACKAGE_VERSION"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 15
          done
          cd /tmp
          python -c "import os; from apisdkopti24 import APIClient, __version__; assert __version__ == os.environ['PACKAGE_VERSION']; print(__version__, APIClient.__name__)"

  publish-pypi:
    # PyPI не позволяет перезаписать версию: публикация только по явному флагу.
    if: github.ref == 'refs/heads/main' && inputs.publish_pypi && inputs.promote_run_id == ''
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: pypi
      url: https://pypi.org/project/apisdkopti24/
    permissions:
      id-token: write

    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish the reviewed artifact to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  promote-pypi:
    # Продвижение пакета, который уже опубликован в TestPyPI и прошёл smoke-тест в
    # прошлом запуске: тот же артефакт, без пересборки.
    if: github.ref == 'refs/heads/main' && inputs.promote_run_id != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/apisdkopti24/
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Verify the source run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.promote_run_id }}
        run: |
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "promote_run_id должен быть числом"
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          path="$(printf '%s' "$run_json" | jq -r '.path')"
          branch="$(printf '%s' "$run_json" | jq -r '.head_branch')"
          smoke="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "smoke-test") | .conclusion')"
          if [ "$path" != ".github/workflows/testpypi.yml" ] || [ "$branch" != "main" ]; then
            echo "Запуск $RUN_ID не является публикацией из main"
            exit 1
          fi
          if [ "$smoke" != "success" ]; then
            echo "В запуске $RUN_ID smoke-тест TestPyPI не прошёл"
            exit 1
          fi

      - name: Download distributions from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
          run-id: ${{ inputs.promote_run_id }}
          github-token: ${{ github.token }}

      - name: Check the downloaded distributions
        run: |
          ls -l dist/
          test "$(find dist -name 'apisdkopti24-*.whl' | wc -l)" -eq 1
          test "$(find dist -name 'apisdkopti24-*.tar.gz' | wc -l)" -eq 1

      - name: Publish the reviewed artifact to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

name: Docs

on:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate documentation
        run: python scripts/generate_docs.py

      - name: Verify generated documentation is committed
        run: git diff --exit-code -- docs/

      - name: Upload generated Markdown
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-documentation
          path: docs/

      - name: Run documentation contract tests
        run: pytest -q tests/test_documentation_generator.py

      - name: Build documentation site in strict mode
        shell: bash
        run: |
          set -o pipefail
          mkdocs build --strict 2>&1 | tee mkdocs-build.log

      - name: Upload MkDocs build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mkdocs-build-log
          path: mkdocs-build.log

      - name: Upload documentation site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: site/

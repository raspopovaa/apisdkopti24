name: Docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate documentation
        run: python scripts/generate_docs.py

      - name: Verify generated documentation is committed
        run: git diff --exit-code -- docs/

      - name: Upload generated Markdown
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-documentation
          path: docs/

      - name: Run documentation contract tests
        run: pytest -q tests/test_documentation_generator.py

      - name: Build documentation site in strict mode
        shell: bash
        run: |
          set -o pipefail
          mkdocs build --strict 2>&1 | tee mkdocs-build.log

      - name: Upload MkDocs build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkdocs-build-log
          path: mkdocs-build.log

      - name: Upload documentation site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/

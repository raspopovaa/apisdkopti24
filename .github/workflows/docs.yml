name: Docs

on:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate documentation
        run: python scripts/generate_docs.py

      - name: Verify generated documentation is committed
        run: git diff --exit-code -- docs/

      - name: Upload generated Markdown
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-documentation
          path: docs/

      - name: Run documentation contract tests
        run: pytest -q tests/test_documentation_generator.py

      - name: Build documentation site in strict mode
        shell: bash
        run: |
          set -o pipefail
          mkdocs build --strict 2>&1 | tee mkdocs-build.log

      - name: Upload MkDocs build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mkdocs-build-log
          path: mkdocs-build.log

      - name: Upload documentation site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: site/

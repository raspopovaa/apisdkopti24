name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Reject repository artifacts
        run: |
          unexpected="$(git ls-files | grep -E '(^|/)\.coverage(\..*)?$|^src/.*\.(diff|patch)$|(^|/)..* 2\.(py|ya?ml|md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Tracked repository artifacts are not allowed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run pytest
        run: pytest

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run branch coverage
        run: pytest --cov=apisdkopti24 --cov-branch --cov-report=term-missing

      - name: Verify external API contract
        run: python scripts/verify_external_contract.py specifications/api-methods.yaml

      - name: Verify API specification v1.1.60
        run: python scripts/verify_api_contract.py specifications/api-contract-v1.1.60.yaml

      - name: Run verified specification audit
        run: python scripts/audit_spec_contract.py --mode verified

      - name: Verify generated operation metadata
        run: python scripts/generate_request_metadata.py --check

      - name: Run full lint checks
        run: ruff check src tests scripts tools typecheck

      - name: Check formatting
        run: black --check src tests scripts tools typecheck

      - name: Type-check SDK
        run: mypy src/apisdkopti24 typecheck

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.8.22"

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements-audit.txt

      - name: Audit runtime dependencies
        run: uvx --from "pip-audit==2.9.0" pip-audit -r requirements-audit.txt

  contract-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate full specification audit
        run: python scripts/audit_spec_contract.py --mode audit

      - name: Upload contract audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-1.1.60-contract-audit
          path: artifacts/contract-audit/
          if-no-files-found: error

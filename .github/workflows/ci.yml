name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reject conflict-copy files
        run: |
          duplicates="$(git ls-files | grep -E '(^|/)..* 2\.(py|ya?ml|md)$' || true)"
          if [ -n "$duplicates" ]; then
            echo "Tracked conflict-copy files are not allowed:"
            echo "$duplicates"
            exit 1
          fi

      - name: Run pytest
        run: pytest

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run branch coverage
        run: pytest --cov=apisdkopti24 --cov-branch --cov-report=term-missing

      - name: Verify external API contract
        run: python scripts/verify_external_contract.py specifications/api-methods.yaml

      - name: Verify API specification v1.1.60
        run: python scripts/verify_api_contract.py specifications/api-contract-v1.1.60.yaml

      - name: Run verified specification audit
        run: python scripts/audit_spec_contract.py --mode verified

      - name: Verify generated operation metadata
        run: python scripts/generate_request_metadata.py --check

      - name: Run full lint checks
        run: ruff check src tests scripts tools typecheck

      - name: Check formatting
        run: black --check src tests scripts tools typecheck

      - name: Type-check SDK
        run: mypy src/apisdkopti24 typecheck

  contract-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate full specification audit
        run: python scripts/audit_spec_contract.py --mode audit

      - name: Upload contract audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-1.1.60-contract-audit
          path: artifacts/contract-audit/
          if-no-files-found: error

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.9.8"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Reject repository artifacts
        run: |
          unexpected="$(git ls-files | grep -E '(^|/)\.coverage(\..*)?$|^src/.*\.(diff|patch)$|(^|/)..* 2\.(py|ya?ml|md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Tracked repository artifacts are not allowed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run pytest
        run: pytest

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.9.8"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run quality gate
        run: python scripts/quality_gate.py tests contracts lint types

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.9.8"

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements-audit.txt

      - name: Audit runtime dependencies
        run: uvx --from "pip-audit==2.9.0" pip-audit -r requirements-audit.txt

      - name: Export locked development dependencies
        run: uv export --frozen --all-extras --no-emit-project --format requirements-txt > requirements-dev-audit.txt

      - name: Audit development dependencies
        run: uvx --from "pip-audit==2.9.0" pip-audit -r requirements-dev-audit.txt

  contract-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.9.8"
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate full specification audit
        run: python scripts/audit_spec_contract.py --mode audit

      - name: Upload contract audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-1.1.60-contract-audit
          path: artifacts/contract-audit/
          if-no-files-found: error

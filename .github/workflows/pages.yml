name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docs-version: ${{ steps.docs-version.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate documentation
        run: python scripts/generate_docs.py

      - name: Verify documentation contracts
        run: pytest -q tests/test_documentation_generator.py

      - name: Determine documentation version
        id: docs-version
        run: |
          version=$(python -c 'import tomllib; value = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; print(".".join(value.split(".")[:2]))')
          echo "DOCS_VERSION=$version" >> "$GITHUB_ENV"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish versioned documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          mike deploy --push --update-aliases --alias-type=redirect "$DOCS_VERSION" latest
          mike set-default --push latest

      - name: Verify published documentation
        run: |
          git fetch origin gh-pages --depth=1
          git show "origin/gh-pages:$DOCS_VERSION/methods/cards/index.html" | grep -Fq "Pydantic-модель"
          git show "origin/gh-pages:$DOCS_VERSION/methods/cards/index.html" | grep -Fq "Поля возвращаемой модели"
          git show "origin/gh-pages:$DOCS_VERSION/data-types/cards/CardInfo/index.html" | grep -Fq "Что проверяет Pydantic"
          git show "origin/gh-pages:$DOCS_VERSION/data-types/final_prices/CheckPurchaseRequest/index.html" | grep -Fq "не означает, что каждый метод SDK автоматически создаёт её"
          git show "origin/gh-pages:$DOCS_VERSION/methods/ewallet/index.html" | grep -Fq "Сумма перевода"
          git show "origin/gh-pages:$DOCS_VERSION/methods/contracts/index.html" | grep -Fq "Сумма счёта в рублях"
          git show "origin/gh-pages:$DOCS_VERSION/methods/templates/index.html" | grep -Fq "Имя шаблона ВК, уникальное в рамках договора"

      - name: Export versioned site
        run: |
          rm -rf site
          mkdir site
          git archive origin/gh-pages | tar -x -C site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deployment-marker
          fetch-depth: 1

      - name: Record successful deployment
        working-directory: deployment-marker
        env:
          DEPLOYED_RUN_ID: ${{ github.run_id }}
          DEPLOYED_SHA: ${{ github.sha }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_DOCS_VERSION: ${{ needs.build.outputs.docs-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("deployment-status.json").write_text(
              json.dumps(
                  {
                      "run_id": os.environ["DEPLOYED_RUN_ID"],
                      "source_sha": os.environ["DEPLOYED_SHA"],
                      "page_url": os.environ["DEPLOYED_URL"],
                      "docs_version": os.environ["DEPLOYED_DOCS_VERSION"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record successful Pages deployment"
            git push origin HEAD:gh-pages
          fi

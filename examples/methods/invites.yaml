# Источник учебных примеров домена invites. Формат полей — в examples/methods/cards.yaml.

domain: invites
title: Приглашения
summary: >-
  Регистрация пользователей по приглашению: создание, список, повторная
  отправка, продление и удаление.

methods:
  create_invite:
    title: Создание приглашения
    goal: >-
      Пригласить водителя или другого пользователя зарегистрироваться. Приглашение
      уходит по SMS или email; ссылку из ответа можно отправить и самостоятельно.
    constants:
      CONTRACT_ID: "1-T000025"
    imports: ["from apisdkopti24.models.invites import InviteCreateRequest"]
    body: |
      request = InviteCreateRequest(
          role="Driver", mobile="79990000000", contracts=[{"id": CONTRACT_ID}]
      )
      response = await client.invites.create_invite(data=request, with_send=True)
      print(f"Приглашение {response.data.id}: {response.data.url}")
    call: 'client.invites.create_invite(data={"role": "Driver", "mobile": "79990000000"})'
    notes:
      - >-
        Нужен `mobile` или `email`: модель запроса не пропустит приглашение без
        получателя, с пустой строкой или с неверным адресом email.
      - >-
        `role` — `Driver` или `Supervisor`: другие роли сервер отклоняет ответом
        `400` без списка допустимых, поэтому модель запроса проверяет роль до
        отправки.
      - >-
        `with_send=False` создаёт приглашение без отправки SMS или письма — ссылку
        из ответа можно передать своим способом.
      - >-
        Приглашение без привязанных карт и без шаблона виртуальной карты API не
        отправляет: отвечает `500` «Приглашение не готово к отправке».
      - >-
        Формат `mobile` в приглашении отличается от `create_user`: здесь API
        принимает номер с `+` (`+79990000000`) и без ведущей `8`, тогда как
        `create_user` требует ровно 11–13 цифр без `+`. Не используйте один и тот
        же способ нормализации номера для обоих методов.
      - >-
        `attempts` в ответе — сколько отправок приглашения осталось на день:
        у приглашения без отправки — `3`, с отправкой — `2`. Следующую отправку
        (`resend_invite`, `prolong_invite(with_send=True)`) API примет не раньше
        чем через минуту, иначе ответит `429`.
    errors:
      - status: 400
        type: validationFailed
        message: Некорректное значение.
        why: Неверный формат телефона.
        fix: Проверьте номер телефона.
    invalid:
      - code: 'client.invites.create_invite(data={"role": "Driver"})'
        why: Не указан ни телефон, ни email получателя.
      - code: 'client.invites.create_invite(data={"role": "Readonly", "mobile": "79990000000"})'
        why: Приглашение принимает только роли `Driver` и `Supervisor`.

  get_invites:
    title: Список приглашений
    goal: >-
      Посмотреть приглашения с их статусом: действует, истекло или завершено
      регистрацией.
    body: |
      response = await client.invites.get_invites(status="Active", page=1, on_page=20)
      for invite in response.data.result:
          print(f"{invite.id}  {invite.role_name}  {invite.status_name}  {invite.mobile}")
    call: client.invites.get_invites(status="Active")
    notes:
      - >-
        Ответ содержит телефоны и email получателей. Не пишите его в журналы целиком.
      - >-
        `role` — `Supervisor`, `Regulatory`, `Driver` или `Readonly`; `status` —
        `Active`, `Expired` или `Finished`. `user_id` — не ID, а флаг:
        `user_id=True` показывает приглашения, по которым уже
        зарегистрировался пользователь. SDK отправляет его как `true`/`false`.
      - >-
        `sort` — поля приглашения через запятую, `-` перед полем — по убыванию,
        например `"-sended_at"`. На неизвестное поле сервер отвечает `500`, а не
        `400`, поэтому SDK проверяет поля по модели `InviteItem` до запроса.
      - >-
        `iter_invites()` принимает те же фильтры и сортировку и сам листает
        страницы.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: Роль пользователя не позволяет работать с приглашениями.
        fix: Проверьте роль пользователя API.
      - status: 400
        type: validationFailed
        message: Некорректное значение.
        why: Значение фильтра не входит в допустимые; список сервер не сообщает.
        fix: Возьмите значения `role` и `status` из описания параметров.
    invalid:
      - code: client.invites.get_invites(sort="bogus")
        why: У приглашения нет поля `bogus`; сервер ответил бы `500`.
      - code: client.invites.get_invites(user_id="user-1")
        why: '`user_id` — флаг `True`/`False`, а не ID пользователя.'

  resend_invite:
    title: Повторная отправка приглашения
    goal: Отправить действующее приглашение ещё раз по SMS или email.
    constants:
      INVITE_ID: "000000000000000000000001"
    body: |
      response = await client.invites.resend_invite(invite_id=INVITE_ID)
      print(f"Отправлено. Попыток повторной отправки в день: {response.data.attempts}")
    call: client.invites.resend_invite(invite_id=INVITE_ID)
    notes:
      - >-
        Метод отправляется запросом GET, но отправляет сообщение получателю,
        поэтому пример спрашивает подтверждение. SDK не повторяет его
        автоматически — ни после `429`/`509`, ни после сетевой ошибки: при
        неясном результате проверьте `attempts` и `sended_at` в `get_invites()`.
      - >-
        Между отправками одного приглашения должна пройти минута: более ранний
        вызов, в том числе сразу после `create_invite(with_send=True)`, сервер
        отклоняет ответом `429`. Это пауза конкретного приглашения, а не общий
        лимит частоты запросов.
      - >-
        После одной успешной повторной отправки `attempts` в ответе изменился с
        2 на 0, а `expired_at` не изменился: повторная отправка не продлевает
        приглашение — для этого есть `prolong_invite()`.
    errors:
      - status: 409
        type: duplicateConflict
        message: Лимит повторных отправок исчерпан
        why: Приглашение уже отправлялось максимально допустимое число раз.
        fix: Создайте новое приглашение или отправьте ссылку самостоятельно.
    invalid: []

  prolong_invite:
    title: Продление приглашения
    goal: Продлить срок действия приглашения, которое ещё не использовано.
    constants:
      INVITE_ID: "5e6fe829-ec61-4a18-8c4e-76df122979a5"
    body: |
      response = await client.invites.prolong_invite(invite_id=INVITE_ID, with_send=False)
      print("Приглашение продлено" if response.data else "Сервер не подтвердил продление")
    call: client.invites.prolong_invite(invite_id=INVITE_ID)
    notes:
      - >-
        `with_send=True` дополнительно отправляет приглашение повторно.
      - >-
        Ответ `data: true` не гарантирует, что срок изменился: после продления без
        отправки (`with_send=False`) `expired_at` и `attempts` в `get_invites()`
        могут остаться прежними. Проверьте `expired_at` после вызова.
    errors:
      - status: 404
        type: notFound
        message: Приглашение не найдено
        why: Приглашение удалено или уже завершено регистрацией.
        fix: Проверьте статус через `get_invites()`.
    invalid: []

  delete_invite:
    title: Удаление приглашения
    goal: Отозвать приглашение, чтобы по ссылке больше нельзя было зарегистрироваться.
    constants:
      INVITE_ID: "000000000000000000000001"
    body: |
      response = await client.invites.delete_invite(invite_id=INVITE_ID)
      print("Приглашение удалено" if response.data else "Сервер не подтвердил удаление")
    call: client.invites.delete_invite(invite_id=INVITE_ID)
    notes:
      - >-
        Если ваша инфраструктура не пропускает запросы DELETE, передайте
        `use_post=True`: SDK отправит POST с полем `_method=DELETE` вместо запроса
        DELETE.
    errors:
      - status: 404
        type: notFound
        message: Приглашение не найдено
        why: Приглашение уже удалено.
        fix: Ничего делать не нужно.
    invalid: []

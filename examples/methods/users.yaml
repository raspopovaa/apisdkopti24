# Источник учебных примеров домена users. Формат полей — в examples/methods/cards.yaml.

domain: users
title: Пользователи
summary: >-
  Водители и другие пользователи клиента: список, создание, привязка к картам и
  договорам, удаление.

methods:
  get_users:
    title: Список пользователей
    goal: >-
      Получить пользователей клиента с ролью, контактами и признаком активности.
      Поддерживает поиск, фильтр и пагинацию.
    body: |
      response = await client.users.get_users(
          filter={"role": "Driver", "active": True}, page=1, on_page=20
      )
      if response.data is None:
          print("Сервер не вернул данные")
          return
      print(f"Пользователей: {response.data.total_count}")
      for user in response.data.result or []:
          print(f"{user.id}  {user.last_name} {user.first_name}  роль: {user.role.name}")
    call: client.users.get_users(page=1, on_page=20)
    response:
      status:
        code: 200
      data:
        total_count: 2
        result:
        - id: 1-T000035
          contracts:
          - sid: 1-T000032
            number: ДГ000000005
            parent_contract_id: ''
            available: true
            template_id: null
            cards_count: 1
            status:
              id: Active
              name: Активен
          - sid: 1-T000036
            number: ДГ000000006
            parent_contract_id: ''
            available: true
            template_id: null
            cards_count: 4
            status:
              id: Active
              name: Активен
          cards:
          - sid: '90000006'
            number: '7000000000000000'
            mpc: true
            product: limit
            carrier: Virtual Card
            comment: 'есть пластик, плачу NFC'
            status: Active
            contract_id: 1-T000036
            contract_name: '90000000001'
            available: true
          login: '79990000000'
          first_name: Иван
          last_name: Иванов
          middle_name: Иванович
          date: 07/12/1991
          position: Ведущий дальнобойщик
          role:
            id: Driver
            name: Водитель
          active: true
          access:
            web: false
            api: false
            mobile: true
          mobile_phone: '79990000000'
          email: 'user@example.com'
        - id: 1-T000038
          contracts:
          - sid: 1-T000031
            number: ДГ000000004
            parent_contract_id: ''
            available: true
            template_id: null
            cards_count: 1
            status:
              id: Active
              name: Активен
          cards:
          - sid: '90000004'
            number: '7000000000000000'
            mpc: true
            product: limit
            carrier: Virtual Card
            comment: ''
            status: Active
            contract_id: 1-T000031
            contract_name: ДГ000000004
            available: true
          login: '79990000000'
          first_name: Иван
          last_name: Иванов
          middle_name: Иванович
          date: 01/01/1991
          position: Водитель
          role:
            id: Driver
            name: Водитель
          active: true
          access:
            web: false
            api: false
            mobile: true
          mobile_phone: '79990000000'
          email: 'user@example.com'
      timestamp: 1585191856
    notes:
      - >-
        Ответ содержит персональные данные: телефоны и email. Не пишите его в
        журналы целиком.
      - >-
        `date` (дата рождения) приходит в формате `MM/DD/YYYY` или `null`. У
        карт пользователя `product` и `status` могут быть `null`.
      - >-
        `q` ищет по фамилии, имени, отчеству, логину, email и телефону.
        `contract_id` оставляет пользователей с этим привязанным договором.
      - >-
        `filter` — `role` (`Supervisor`, `Regulatory`, `Driver` или `Readonly`) и
        `active` (`True`/`False`). На неизвестную роль сервер молча отвечает пустым
        списком, поэтому SDK проверяет роль до запроса.
      - >-
        `sort` — поля пользователя через запятую, `-` перед полем — по убыванию,
        например `"login,-id"`. Неизвестное поле сервер молча игнорирует, поэтому
        SDK сверяет поля с моделью `UserItem` до запроса.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: Роль пользователя API не позволяет управлять пользователями.
        fix: Проверьте роль пользователя API.
    invalid:
      - code: 'client.users.get_users(filter={"status": "Active"})'
        why: Фильтр поддерживает только поля `role` и `active`.
      - code: 'client.users.get_users(filter={"role": "Admin"})'
        why: Сервер молча вернул бы пустой список.
      - code: client.users.get_users(sort="name")
        why: У пользователя нет поля `name`; сервер молча проигнорировал бы сортировку.

  create_user:
    title: Создание пользователя
    goal: >-
      Создать водителя по телефону и вашему внутреннему ID. Телефон становится
      логином пользователя.
    body: |
      response = await client.users.create_user(
          uuid="62f2e267-4398-4ea2-b02e-6e88b81b0958", mobile="79990000000"
      )
      print(f"ID пользователя: {response.data}")
    call: client.users.create_user(uuid="62f2e267-4398-4ea2-b02e-6e88b81b0958", mobile="79990000000")
    notes:
      - >-
        `uuid` — ваш собственный идентификатор водителя, по нему удобно сопоставлять
        пользователя с вашей системой.
      - >-
        `mobile` — только цифры, от 11 до 13, без `+`: номер `+79990000000` API
        отклоняет с ошибкой `400`, поэтому SDK проверяет формат до платного
        запроса. Десятизначный номер из примера в описании API тоже не пройдёт
        проверку. Номер с ведущей `8` вместо `7` API принимает — уточните у
        клиента, какой логин он ожидает получить.
    errors:
      - status: 403
        type: accessDenied
        message: Указанный логин пользователя уже существует в системе
        why: >-
          Телефон уже используется как логин другого пользователя. Сервер
          отвечает `403 accessDenied`, а не `409 duplicateConflict` — при
          повторном создании с тем же `mobile` не полагайтесь на код ошибки,
          проверяйте текст сообщения или ищите пользователя заранее.
        fix: Найдите пользователя через `get_users(q=...)`.
    invalid:
      - code: client.users.create_user(uuid="62f2e267-4398-4ea2-b02e-6e88b81b0958", mobile="")
        why: Телефон обязателен.
      - code: client.users.create_user(uuid="62f2e267-4398-4ea2-b02e-6e88b81b0958", mobile="+79990000000")
        why: Сервер принимает только цифры, без `+`.

  attach_card:
    title: Привязка карты к пользователю
    goal: Разрешить пользователю работать с картой.
    constants:
      USER_ID: "1-T000066"
      CARD_ID: "9000028"
    body: |
      response = await client.users.attach_card(user_id=USER_ID, card_id=CARD_ID)
      print("Карта привязана" if response.data else "Сервер не подтвердил привязку")
    call: client.users.attach_card(user_id=USER_ID, card_id=CARD_ID)
    notes:
      - >-
        Привязка применяется не сразу: примерно 90 секунд у карты пользователя в
        `get_users()` поле `carrier` пустое, а у договора нет `cards_count`. Не
        считайте привязку неудавшейся по первому чтению после вызова.
    errors:
      - status: 404
        type: notFound
        message: Пользователь не найден
        why: Пользователя или карты с таким ID нет.
        fix: Проверьте ID через `get_users()` и `client.cards.get_cards_v2()`.
    invalid:
      - code: client.users.attach_card(user_id="../users", card_id=CARD_ID)
        why: '`user_id` подставляется в путь запроса, поэтому символы `/` запрещены.'

  detach_card:
    title: Отвязка карты от пользователя
    goal: Запретить пользователю работать с картой.
    constants:
      USER_ID: "1-T000066"
      CARD_ID: "9000028"
    body: |
      response = await client.users.detach_card(user_id=USER_ID, card_id=CARD_ID)
      print("Карта отвязана" if response.data else "Сервер не подтвердил отвязку")
    call: client.users.detach_card(user_id=USER_ID, card_id=CARD_ID)
    notes: []
    errors:
      - status: 403
        type: accessDenied
        message: Данная карта не привязана к пользователю
        why: Карта не была привязана к этому пользователю.
        fix: Проверьте карты пользователя в `get_users()`.
    invalid: []

  attach_contracts:
    title: Привязка договоров к пользователю
    goal: >-
      Закрепить пользователя за договорами, указать шаблон виртуальной карты и
      разрешить выпуск мобильного профиля карты (МПК).
    constants:
      USER_ID: "1-T000066"
      CONTRACT_ID: "1-T000036"
    imports: ["from apisdkopti24.models.users import UserAttachContractRequest"]
    body: |
      contracts = [UserAttachContractRequest(sid=CONTRACT_ID, use_mpc=True)]
      response = await client.users.attach_contracts(user_id=USER_ID, contracts=contracts)
      print("Договоры привязаны" if response.data else "Сервер не подтвердил привязку")
    call: 'client.users.attach_contracts(user_id=USER_ID, contracts=[{"sid": CONTRACT_ID}])'
    notes:
      - >-
        `use_mpc=True` разрешает пользователю выпускать мобильный профиль карты — без
        него виртуальной картой нельзя платить.
      - >-
        Тело запроса — JSON-массив договоров.
    errors:
      - status: 404
        type: notFound
        message: Договор не найден
        why: Договора с таким `sid` нет у клиента.
        fix: Возьмите ID договора из `client.auth.auth_user()`.
    invalid:
      - code: client.users.attach_contracts(user_id=USER_ID, contracts=[])
        why: Нужен хотя бы один договор.

  detach_contracts:
    title: Отвязка договоров от пользователя
    goal: Убрать доступ пользователя к договорам.
    constants:
      USER_ID: "1-T000066"
      CONTRACT_ID: "1-T000036"
    body: |
      response = await client.users.detach_contracts(user_id=USER_ID, contracts=[CONTRACT_ID])
      print("Договоры отвязаны" if response.data else "Сервер не подтвердил отвязку")
    call: client.users.detach_contracts(user_id=USER_ID, contracts=[CONTRACT_ID])
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Пользователь не найден
        why: Пользователя с таким ID нет.
        fix: Проверьте ID через `get_users()`.
    invalid:
      - code: client.users.detach_contracts(user_id=USER_ID, contracts=[])
        why: Нужен хотя бы один договор.

  delete_user:
    title: Удаление пользователя
    goal: Удалить пользователя, например уволенного водителя.
    constants:
      USER_ID: "1-T000066"
    body: |
      response = await client.users.delete_user(user_id=USER_ID)
      print("Пользователь удалён" if response.data else "Сервер не подтвердил удаление")
    call: client.users.delete_user(user_id=USER_ID)
    notes:
      - >-
        Если инфраструктура не пропускает запросы DELETE, передайте
        `use_post=True`: SDK отправит POST с полем `_method=DELETE`.
      - >-
        Удаление бывает дольше 30 секунд, хотя пользователь на сервере удаляется.
        SDK ждёт ответа до 300 секунд (класс таймаута `slow_mutation`), после
        этого поднимает `APIResponseTimeoutError` и метод не повторяет. Такая
        ошибка не значит, что пользователь остался: проверьте `get_users()`.
    errors:
      - status: 404
        type: notFound
        message: Пользователь не найден
        why: Пользователь уже удалён.
        fix: Ничего делать не нужно.
    invalid: []

# Источник учебных примеров домена virtual_cards. Формат полей — в examples/methods/cards.yaml.
#
# Для методов МПК и QR нет записанных ответов API: ответы ниже условные, их
# структура повторяет модели SDK.

domain: virtual_cards
title: Виртуальные карты и оплата по QR
summary: >-
  Выпуск виртуальных карт, мобильный профиль карты (МПК) на устройстве водителя
  и платёжная строка для оплаты по QR-коду.

methods:
  create_virtual_card:
    title: Выпуск виртуальной карты
    goal: >-
      Выпустить виртуальную карту по шаблону ВК, закреплённому за пользователем,
      или по явно указанному шаблону.
    constants:
      USER_ID: "1-2Q468ZB"
    body: |
      response = await client.virtual_cards.create_virtual_card(user_id=USER_ID)
      card = response.data
      print(f"Карта {card.id}: {card.carrier}, продукт {card.product}, статус {card.status}")
    call: client.virtual_cards.create_virtual_card(user_id=USER_ID)
    notes:
      - >-
        Порядок подготовки: создать и настроить шаблон ВК
        (`client.templates.create_template()`), закрепить его за пользователем,
        который будет выпускать карты (`client.users.attach_contracts()`, поле
        `template_id`), после чего выпускать карты.
      - >-
        `template_id` можно не передавать, если шаблон виртуальной карты уже
        закреплён за пользователем через `client.users.attach_contracts()`.
      - >-
        Договор — `contract_id` или выбранный договор сессии. Без договора сервер
        выпустил бы карту на первый из договоров пользователя, поэтому SDK всегда
        передаёт договор и без него выдаёт `RequestValidationError` до запроса.
      - >-
        `user_id` необязателен: вызов только с `template_id` выпускает карту на
        договор. Ответ содержит `id`, `number`, `carrier`, `product` и `status`
        новой карты.
      - >-
        Метод выпускает реальную карту и тарифицируется, на DEMO недоступен; SDK не
        повторяет его автоматически. При неясном результате проверьте список карт
        через `client.cards.get_cards_v2()`.
      - >-
        В описании API тело запроса — JSON, но SDK отправляет форму: сервер её
        принимает.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: >-
          Роль учётной записи не разрешает метод, договор не привязан к учётной
          записи, исчерпан тариф или неверен ключ API.
        fix: Проверьте роль, привязку договора и остаток запросов по тарифу.
    invalid: []

  release_virtual_card:
    title: Выпуск виртуальной карты по типу или шаблону
    goal: >-
      Выпустить виртуальную карту, указав её тип (`limit` или `wallet`) либо
      шаблон виртуальной карты.
    body: |
      response = await client.virtual_cards.release_virtual_card(type_="wallet")
      print(f"Выпущена карта {response.data.id}, статус {response.data.status}")
    call: client.virtual_cards.release_virtual_card(type_="wallet")
    notes:
      - >-
        Нужно указать ровно один источник: `type_` или `template_id`. SDK проверяет
        это до отправки запроса.
      - >-
        Оба варианта — с `type_` и с `template_id` — выпускают карту и возвращают
        тот же объект, что и `create_virtual_card()`: `id`, `number`, `carrier`,
        `product`, `status`.
      - >-
        Договор — `contract_id` или выбранный договор сессии: без договора сервер
        выпустил бы карту на первый из договоров пользователя.
      - >-
        Метод выпускает реальную карту и тарифицируется, на DEMO недоступен; SDK не
        повторяет его автоматически. В описании API тело — JSON, SDK отправляет
        форму: сервер её принимает.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: >-
          Роль учётной записи не разрешает метод, договор не привязан к учётной
          записи, исчерпан тариф или неверен ключ API.
        fix: Проверьте роль, привязку договора и остаток запросов по тарифу.
    invalid:
      - code: client.virtual_cards.release_virtual_card(type_="wallet", template_id="1-3BE470B")
        why: Нельзя одновременно передать тип карты и шаблон.

  get_mpc_qr_list:
    title: Список мобильных профилей карт
    goal: >-
      Получить выпущенные мобильные профили карт (МПК): на каком устройстве
      выпущен профиль, сколько попыток оплаты разрешено и работает ли он.
    body: |
      response = await client.virtual_cards.get_mpc_qr_list()
      for item in response.data.result:
          state = "работает" if item.use_mpc else "отключён"
          print(f"Карта {item.card_id} на устройстве «{item.device_name}» — {state}")
    call: client.virtual_cards.get_mpc_qr_list()
    response:
      status:
        code: 200
      data:
        total_count: 1
        result:
          - _id: "64f0c2a1e4b0a1b2c3d4e5f6"
            client_id: "1-2Q45DA8"
            user_id: "1-2Q468ZB"
            login: "79990000000"
            role: "Driver"
            contract_id: "1-2Q4CN99"
            card_id: "15054450"
            card_number: "7000000000000000"
            device_id: "device-example"
            device_name: "Pixel Example"
            tries: 3
            transaction_count: 0
            use_mpc: true
            created_at: "2026-09-01 10:00:00"
      timestamp: 1596024392
    response_note: >-
      Пример ответа условный: структура совпадает с моделью SDK.
    notes:
      - >-
        Без `contract_id` метод вернёт профили по всем договорам клиента: договор
        сессии он не подставляет.
      - >-
        Номер карты и ID устройства не попадают в `repr` профиля; не выводите их в
        журналы.
      - >-
        QR API работает на QR-тестовом стенде и рабочем сервере, на DEMO его нет.
        Методы QR не тарифицируются и на сервере пока не проверены.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: Доступ к данным запрещён для учётной записи (роль, ключ API, договор).
        fix: Проверьте роль учётной записи и подключение сервиса QR.
    invalid: []

  init_mpc:
    title: Выпуск мобильного профиля карты
    goal: >-
      Первый шаг выпуска МПК на устройстве водителя: задать PIN профиля и
      устройство. Затем профиль подтверждается кодом из SMS через `confirm_mpc`.
    constants:
      CARD_ID: "15054450"
      USER_ID: "1-2Q468ZB"
    body: |
      response = await client.virtual_cards.init_mpc(
          card_id=CARD_ID,
          user_id=USER_ID,
          pin="4815",
          device_id="device-example",
          device_name="Pixel Example",
      )
      print("Код подтверждения отправлен по SMS" if response.data else "Выпуск не начат")
    call: client.virtual_cards.init_mpc(card_id=CARD_ID, user_id=USER_ID, pin="4815", device_id="device-example", device_name="Pixel Example")
    response:
      status:
        code: 200
      data: true
      timestamp: 1596024392
    response_note: Пример ответа условный, структура совпадает с моделью SDK.
    notes:
      - >-
        PIN — от 4 до 8 цифр, название устройства — от 11 до 17 символов. SDK
        проверяет их до входа и запроса; в журналах SDK PIN и ID устройства скрыты.
      - >-
        Карта должна быть привязана к `user_id`. На карте может быть только один
        МПК: существующий сначала удалите через `delete_mpc()`.
      - >-
        Договор — `contract_id` или выбранный договор сессии; SDK передаёт его
        заголовком. Метод не тарифицируется и не повторяется автоматически.
    errors:
      - status: 400
        type: validationFailed
        message: Некорректные параметры запроса
        why: Сервер отклонил параметры запроса; подробности — в сообщении ошибки.
        fix: Проверьте привязку карты к пользователю и отсутствие МПК на карте.
    invalid:
      - code: client.virtual_cards.init_mpc(card_id=CARD_ID, user_id=USER_ID, pin="12", device_id="device-example", device_name="Pixel Example")
        why: PIN должен состоять из 4–8 цифр.
      - code: client.virtual_cards.init_mpc(card_id=CARD_ID, user_id=USER_ID, pin="4815", device_id="device-example", device_name="Pixel")
        why: Название устройства короче 11 символов.

  confirm_mpc:
    title: Подтверждение мобильного профиля карты
    goal: 'Второй шаг выпуска МПК: подтвердить его кодом из SMS.'
    constants:
      CARD_ID: "15054450"
    body: |
      response = await client.virtual_cards.confirm_mpc(card_id=CARD_ID, code="123456")
      print("Профиль выпущен" if response.data else "Сервер не подтвердил выпуск")
    call: client.virtual_cards.confirm_mpc(card_id=CARD_ID, code="123456")
    response:
      status:
        code: 200
      data: true
      timestamp: 1596024392
    response_note: Пример ответа условный, структура совпадает с моделью SDK.
    notes:
      - >-
        Код приходит по SMS на телефон пользователя. Неверный код блокирует выпуск
        МПК по карте; SDK не повторяет подтверждение автоматически. Блокировку
        снимает администратор через `reset_mpc()`.
    errors:
      - status: 400
        type: validationFailed
        message: Некорректные параметры запроса
        why: Сервер отклонил код подтверждения; повторный ввод неверного кода не поможет.
        fix: Не перебирайте коды — снимите блокировку через `reset_mpc()` и начните выпуск заново.
    invalid:
      - code: client.virtual_cards.confirm_mpc(card_id=CARD_ID, code="")
        why: Пустой код отклоняется моделью запроса.

  generate_payment_qr:
    title: Платёжная строка для оплаты по QR
    goal: >-
      Получить платёжную строку по мобильному профилю карты. Приложение водителя
      показывает её как QR-код на кассе АЗС.
    constants:
      CARD_ID: "15054450"
    body: |
      response = await client.virtual_cards.generate_payment_qr(card_id=CARD_ID, pin="4815")
      qr = response.data
      print(f"Строка действует до {qr.end_date}, попыток оплаты: {qr.tries}")
    call: client.virtual_cards.generate_payment_qr(card_id=CARD_ID, pin="4815")
    response:
      status:
        code: 200
      data:
        code: "PAYMENT-STRING-EXAMPLE"
        end_date: 1788240000
        transaction_count: 0
        tries: 3
      timestamp: 1596024392
    response_note: Пример ответа условный, структура совпадает с моделью SDK.
    notes:
      - >-
        Платёжная строка `code` — то же, что деньги на кассе: не сохраняйте её и
        не пишите в журналы.
      - >-
        Строка действует до 10 минут. `end_date` — срок жизни строки; по примеру
        ответа API это Unix-время окончания (секунды). Проверяйте
        его перед показом и выпускайте новую строку после истечения срока.
      - >-
        Число выпущенных кодов ограничено `tries`; когда `transaction_count`
        достигает `tries`, сервер сам перевыпускает МПК. Не сбрасывайте и не
        пересчитывайте счётчики на своей стороне.
      - >-
        Договор методу не нужен; SDK передаёт его, только если он указан или выбран
        в сессии. Платёжная строка не попадает в `repr` ответа.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: >-
          Доступ к МПК запрещён. Оплата с неверными секретными значениями
          блокирует оплату по карте.
        fix: Перевыпустите МПК через `update_mpc()`; блокировку снимает `reset_mpc()`.
    invalid:
      - code: client.virtual_cards.generate_payment_qr(card_id=CARD_ID, pin="abcd")
        why: PIN состоит только из цифр.

  update_mpc:
    title: Смена PIN или перевыпуск ключей МПК
    goal: >-
      Сменить PIN мобильного профиля карты. Без нового PIN метод перевыпускает
      ключи оплаты.
    constants:
      CARD_ID: "15054450"
    body: |
      response = await client.virtual_cards.update_mpc(card_id=CARD_ID, pin="4815", new_pin="162342")
      print("PIN изменён" if response.data else "Сервер не подтвердил изменение")
    call: client.virtual_cards.update_mpc(card_id=CARD_ID, pin="4815", new_pin="162342")
    response:
      status:
        code: 200
      data: true
      timestamp: 1596024392
    response_note: Пример ответа условный, структура совпадает с моделью SDK.
    notes:
      - >-
        Перевыпуск помогает и при ошибках оплаты на АЗС. Метод не повторяется
        автоматически.
    errors:
      - status: 400
        type: validationFailed
        message: Некорректные параметры запроса
        why: Сервер отклонил параметры запроса, например текущий PIN.
        fix: Проверьте текущий PIN; не повторяйте запрос вслепую.
    invalid:
      - code: client.virtual_cards.update_mpc(card_id=CARD_ID, pin="4815", new_pin="1")
        why: Новый PIN должен состоять из 4–8 цифр.

  reset_mpc:
    title: Сброс счётчика мобильного профиля
    goal: >-
      Снять блокировку выпуска МПК (после неверного SMS-кода) или оплаты по карте
      (после неверных секретных значений).
    constants:
      CARD_ID: "5050543"
    body: |
      response = await client.virtual_cards.reset_mpc(card_id=CARD_ID, type_="ResetCounterCode")
      print("Счётчик сброшен" if response.data else "Сервер не подтвердил сброс")
    call: client.virtual_cards.reset_mpc(card_id=CARD_ID)
    response:
      status:
        code: 200
      data: true
      timestamp: 1596024392
    response_note: Пример ответа условный, структура совпадает с моделью SDK.
    notes:
      - >-
        `type_`: `ResetCounterCode` (по умолчанию) или `ResetCounterMPC`. Какой тип
        какую блокировку снимает, описание API не уточняет.
    errors:
      - status: 404
        type: notFound
        message: Объект не найден
        why: Сервер не нашёл объект запроса.
        fix: Проверьте `card_id` и профили через `get_mpc_qr_list()`.
    invalid:
      - code: client.virtual_cards.reset_mpc(card_id=CARD_ID, type_="ResetAll")
        why: Допустимы только типы `ResetCounterCode` и `ResetCounterMPC`.

  delete_mpc:
    title: Удаление мобильного профиля карты
    goal: Отключить мобильный профиль карты, например при смене телефона водителя.
    constants:
      CARD_ID: "5050543"
    body: |
      response = await client.virtual_cards.delete_mpc(card_id=CARD_ID)
      print("Профиль удалён" if response.data else "Сервер не подтвердил удаление")
    call: client.virtual_cards.delete_mpc(card_id=CARD_ID)
    response:
      status:
        code: 200
      data: true
      timestamp: 1596024392
    response_note: Пример ответа условный, структура совпадает с моделью SDK.
    notes:
      - >-
        Удаление нужно перед повторным выпуском МПК на той же карте. Метод не
        повторяется автоматически: при неясном результате проверьте
        `get_mpc_qr_list()`.
    errors:
      - status: 404
        type: notFound
        message: Объект не найден
        why: Сервер не нашёл объект запроса.
        fix: Проверьте `card_id` и профили через `get_mpc_qr_list()`.
    invalid:
      - code: client.virtual_cards.delete_mpc(card_id=" ")
        why: Пустой `card_id` отклоняется до входа и запроса.

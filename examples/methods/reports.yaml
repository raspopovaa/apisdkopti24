# Источник учебных примеров домена reports. Формат полей — в examples/methods/cards.yaml.

domain: reports
title: Отчёты
summary: >-
  Заказ отчётов по договору и картам, список заказанных отчётов и скачивание
  готовых файлов.

methods:
  get_reports:
    title: Доступные отчёты
    goal: >-
      Получить отчёты, которые можно заказать: ID отчёта, форматы файла и
      параметры. ID и параметры передаются в `order_report`.
    body: |
      response = await client.reports.get_reports()
      for report in response.data.result:
          params = ", ".join(parameter.name for parameter in report.parameters)
          print(f"{report.id}: {report.name} [{', '.join(report.formats)}] параметры: {params}")
    call: client.reports.get_reports()
    notes: []
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: Роль пользователя не позволяет заказывать отчёты.
        fix: Проверьте роль пользователя API.
    invalid: []

  order_report:
    title: Заказ отчёта
    goal: >-
      Заказать формирование отчёта. Отчёт формируется асинхронно: метод
      возвращает `job_id`, по которому потом скачивается файл.
    constants:
      CONTRACT_ID: "1-2Q4CN99"
    body: |
      response = await client.reports.order_report(
          report_id="tsc_report_transaction_reriod",
          format="xlsx",
          params={
              "start_date": "2026-09-01",
              "end_date": "2026-09-30",
              "id_agreement": [CONTRACT_ID],
          },
      )
      print(f"Задачи отчёта: {', '.join(response.data.job_id or [])}")
    call: 'client.reports.order_report(report_id="tsc_report_transaction_reriod", format="xlsx", params={"start_date": "2026-09-01", "end_date": "2026-09-30", "id_agreement": [CONTRACT_ID]})'
    notes:
      - >-
        ID отчёта, форматы и имена параметров берутся из `get_reports()`.
      - >-
        Списочные параметры — `id_agreement`, `id_card`, `card_group_code`,
        `id_client` — передаются массивами строк, даже если значение одно.
      - >-
        Если передать `emails` — список адресов, — готовый отчёт придёт и на почту.
        Отправка на почту ограничена 15 МБ.
      - >-
        Период `start_date`–`end_date` — не длиннее 1 календарного месяца: конец не
        позже той же даты следующего месяца (например, с 2026-09-01 по 2026-10-01).
        Более длинный период сервер не отклоняет, а молча сокращает, поэтому SDK
        отклоняет его до запроса (`RequestValidationError`), так же как неверный
        формат дат и конец раньше начала. Отчёт за месяц формируется около 5 минут.
      - >-
        Тарификация зависит от способа доставки. Таблица тарификации в
        `get_info().data.methods_info` относит заказ с отправкой на email
        (`reports_post`) к платным действиям, а заказ только по ссылке, без
        `emails` (`reports_post_file`), — к бесплатным. SDK помечает метод платным
        по худшему случаю.
      - >-
        Ответ `{"job_id": []}` означает, что задача не создана: новой записи в
        `get_report_jobs()` не появится. Так отвечает DEMO-стенд, и так же API
        отвечает на заказ транзакционного отчёта без `id_agreement`. С
        `id_agreement` задача появляется в списке сразу. После любого заказа
        проверяйте, что задача появилась в списке.
    errors:
      - status: 404
        type: notFound
        message: Не найден отчет
        why: >-
          Отчёта с таким ID нет или он недоступен договору.
        fix: Возьмите `id` отчёта из `get_reports()`.
    invalid:
      - code: client.reports.order_report(report_id="", format="xlsx", params={})
        why: Пустой ID отчёта отклоняется до отправки запроса.
      - code: 'client.reports.order_report(report_id="tsc_report_transaction_reriod", format="xlsx", params={"start_date": "2026-09-01", "end_date": "2026-10-15"})'
        why: Период длиннее 1 календарного месяца сервер молча сократил бы.
      - code: 'client.reports.order_report(report_id="tsc_report_transaction_reriod", format="xlsx", params={}, emails="accounting@example.org")'
        why: '`emails` — список адресов, а не строка.'

  get_report_jobs:
    title: Заказанные отчёты
    goal: >-
      Получить отчёты, заказанные за последние 14 дней, с их `job_id` и тем, через
      сколько секунд файл можно будет скачать.
    body: |
      response = await client.reports.get_report_jobs()
      for job in response.data.result:
          print(f"{job.job_id}  {job.report_name}  {job.report_format}  готов через {job.available_after} с")
    call: client.reports.get_report_jobs()
    notes:
      - >-
        `available_after` — через сколько секунд отчёт ожидается готовым. Значение
        `0` не гарантирует, что файл сформирован: скачивание может ещё долго
        отвечать `404` «Формирование отчета не завершено». Список задач общий с
        `get_report_job_list_v1()`: там видны и задачи, заказанные через
        `order_report_v1()`.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: Роль пользователя не позволяет работать с отчётами.
        fix: Проверьте роль пользователя API.
    invalid: []

  download_report_file:
    title: Скачивание файла отчёта
    goal: >-
      Скачать готовый файл отчёта по `job_id`. Имя, формат и сохранение файла —
      на стороне приложения.
    constants:
      JOB_ID: "1-425XN6L"
    body: |
      content = await client.reports.download_report_file(job_id=JOB_ID)
      print(f"Получено {len(content)} байт")
    call: client.reports.download_report_file(job_id=JOB_ID)
    response_file:
      content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      text: "содержимое файла отчёта"
    notes:
      - >-
        Метод загружает файл в память. Для больших отчётов используйте
        `download_report_file_to(job_id=..., destination="report.xlsx")`: он
        записывает файл на диск частями.
      - >-
        Размер файла в памяти ограничен настройкой `max_in_memory_response_bytes`
        (по умолчанию 64 МиБ).
    errors:
      - status: 404
        type: notFound
        message: Формирование отчета не завершено, пожалуйста, попробуйте позже.
        why: >-
          Файл ещё не сформирован. Так бывает и когда `available_after` в списке
          задач уже `0`.
        fix: Повторите скачивание через несколько минут; не заказывайте отчёт заново.
      - status: 500
        type: internalError
        message: Произошла ошибка. Отчет не будет сформирован. Закажите новый отчет
        why: >-
          Формирование отчёта завершилось неудачей. В списке задач у неё остаётся
          `available_after = 0`, поля статуса нет. Исключение помечено
          `retryable=True`, как любой `500`, но повтор скачивания не поможет.
        fix: Закажите отчёт заново.
    invalid:
      - code: client.reports.download_report_file(job_id="")
        why: Пустой `job_id` отклоняется до отправки запроса.

  order_report_v1:
    title: Заказ транзакционного отчёта (API v1)
    goal: >-
      Заказать транзакционный отчёт за период по договору, списку карт или
      группам карт через первую версию API.
    constants:
      CONTRACT_ID: "1-2Q4CN99"
    body: |
      response = await client.reports.order_report_v1(
          contract_id=CONTRACT_ID,
          start="2026-09-01",
          end="2026-09-30",
          report_format="xlsx",
          email="accounting@example.org",
      )
      print(f"Задачи отчёта: {', '.join(response.data or [])}")
    call: client.reports.order_report_v1(contract_id=CONTRACT_ID, start="2026-09-01", end="2026-09-30", report_format="xlsx")
    notes:
      - >-
        Метод отправляется запросом GET, но создаёт задачу отчёта, поэтому пример
        спрашивает подтверждение. SDK не повторяет его автоматически: при неясном
        результате проверьте `get_report_job_list_v1()`, прежде чем заказывать снова.
      - >-
        `cards_list` — 16-значные номера карт договора, `group_id` — ID групп карт.
        SDK передаёт оба списка строками JSON-массива. Без них отчёт строится по всем
        картам договора.
      - >-
        Период `start`–`end` — не длиннее 3 календарных месяцев: конец не позже той
        же даты через 3 месяца. Более длинный период сервер не отклоняет, а молча
        сокращает, поэтому SDK отклоняет его до запроса (`RequestValidationError`).
        Отчёт за месяц формируется около 5 минут, за больший период — до 15 минут.
      - >-
        Без `contract_id` SDK берёт выбранный договор сессии. Все проверки
        параметров выполняются до входа и платного запроса.
      - >-
        Тарификация зависит от способа доставки. Таблица тарификации в
        `get_info().data.methods_info` относит запрос с отправкой на email
        (`reports`) к платным действиям, а запрос только по ссылке, без `email`
        (`reports_file`), — к бесплатным. SDK помечает метод платным по худшему
        случаю.
    errors:
      - status: 400
        type: validationFailed
        message: Некорректный период
        why: Период отчёта задан неверно.
        fix: Передайте даты в формате `YYYY-MM-DD`, начало не позже конца.
    invalid:
      - code: client.reports.order_report_v1(contract_id=CONTRACT_ID, start="2026-09-30", end="2026-09-01", report_format="xlsx")
        why: Дата окончания не может быть раньше даты начала.
      - code: client.reports.order_report_v1(contract_id=CONTRACT_ID, start="2026-01-01", end="2026-04-15", report_format="xlsx")
        why: Период длиннее 3 календарных месяцев сервер молча сократил бы.
      - code: client.reports.order_report_v1(contract_id=CONTRACT_ID, start="2026-09-01", end="2026-09-30", report_format="docx")
        why: Допустимы только форматы `xlsx`, `xml`, `pdf` и `csv`.

  get_report_job_list_v1:
    title: Заказанные отчёты (API v1)
    goal: Получить отчёты, заказанные за последние 7 дней, через первую версию API.
    body: |
      response = await client.reports.get_report_job_list_v1()
      for job in response.data:
          print(f"{job.job_id}  {job.date}  {job.report_name}  {job.report_format}")
    call: client.reports.get_report_job_list_v1()
    notes:
      - >-
        Задача появляется в списке сразу после `order_report_v1()`.
        `available_after` — обратный отсчёт в секундах до ожидаемой готовности:
        отчёт за месяц бывает готов примерно через 5 минут. `0` не гарантирует,
        что файл сформирован: скачивание может отвечать `404` «Формирование отчета
        не завершено» и спустя полчаса. Повторяйте скачивание с паузой в несколько
        минут, а не сразу. Список задач общий с `get_report_jobs()`.
    errors:
      - status: 403
        type: accessDenied
        message: Доступ запрещён
        why: Роль пользователя не позволяет работать с отчётами.
        fix: Проверьте роль пользователя API.
    invalid: []

  download_report_file_v1:
    title: Скачивание файла отчёта (API v1)
    goal: >-
      Скачать файл отчёта по `job_id` через первую версию API; с `archive=True`
      файл придёт в ZIP-архиве.
    constants:
      JOB_ID: "1-24H0D3I"
    body: |
      content = await client.reports.download_report_file_v1(job_id=JOB_ID, archive=True)
      print(f"Получено {len(content)} байт архива")
    call: client.reports.download_report_file_v1(job_id=JOB_ID)
    response_file:
      content_type: application/zip
      text: "содержимое архива отчёта"
    notes:
      - >-
        Для больших файлов используйте `download_report_file_v1_to(job_id=...,
        destination=...)`.
    errors:
      - status: 404
        type: notFound
        message: Формирование отчета не завершено, пожалуйста, попробуйте позже.
        why: >-
          Файл ещё не сформирован. Так бывает и когда `available_after` в списке
          задач уже `0`.
        fix: Повторите скачивание через несколько минут; не заказывайте отчёт заново.
      - status: 500
        type: internalError
        message: Произошла ошибка. Отчет не будет сформирован. Закажите новый отчет
        why: >-
          Формирование отчёта завершилось неудачей. В списке задач у неё остаётся
          `available_after = 0`, поля статуса нет. Исключение помечено
          `retryable=True`, как любой `500`, но повтор скачивания не поможет.
        fix: Закажите отчёт заново.
      - status: 403
        type: accessDenied
        message: Нет доступа
        why: Задачи с таким `job_id` нет — API отвечает `403`, а не `404`.
        fix: Проверьте `job_id` в `get_report_job_list_v1()`.
    invalid: []

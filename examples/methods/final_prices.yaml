# Источник учебных примеров домена final_prices. Формат полей — в examples/methods/cards.yaml.

domain: final_prices
title: Итоговые цены
summary: >-
  Расчёт цены товаров для карты на конкретной АЗС с учётом тарифа договора и
  проверка возможности покупки.

methods:
  get_final_prices:
    title: Итоговая цена товаров на АЗС
    goal: >-
      Узнать, сколько будет стоить литр топлива по карте на выбранной АЗС с учётом
      тарифа договора, лимитов и ограничителей карты.
    constants:
      CARD_ID: "900042"
      POI_ID: "900019"
    body: |
      response = await client.final_prices.get_final_prices(
          card_id=CARD_ID, poi_id=POI_ID, goods=["00000000000007", "00000000000009"]
      )
      for item in response.data.goods:
          print(f"{item.code}: {item.price}")
    call: 'client.final_prices.get_final_prices(card_id=CARD_ID, poi_id=POI_ID, goods=["00000000000007"])'
    notes:
      - >-
        `poi_id` — ID торговой точки из `client.dictionaries.get_azs_list_v2()`, коды
        товаров — из справочника `Goods`.
      - >-
        Метод только читает данные, хотя отправляется запросом POST, поэтому пример
        не спрашивает подтверждение.
      - >-
        SDK отправляет `poi_id` и `goods` телом JSON: в форме сервер не
        принимает `goods` как массив и отвечает `400` «Поле goods должно быть
        массивом».
      - >-
        ID вида `1-…` (как `poi_id` в транзакциях) метод не принимает — API
        отвечает `400` «АЗС не найдена». `poi_id` транзакции совпадает с
        `siebelId` точки в `get_azs_list_v1()`: чтобы узнать цены на АЗС, где была
        транзакция, найдите точку с таким `siebelId` и передайте её числовой `id`.
        Номер точки (`contractName`), её код (`contractNumber`) и `terminal_id`
        метод тоже не принимает.
      - >-
        Отказ процессинга (например, карта не обслуживается на точке или
        временно недоступна) тоже приходит как `403 accessDenied`: код причины
        указан только в тексте сообщения, например «ОТКАЗ. Обратитесь к
        персоналу торговой точки для повтора операции. [Код ошибки: 12]». Это не
        связано с правами пользователя API — не проверяйте `api_key` или роль по
        такому ответу, разбирайте текст сообщения.
    errors:
      - status: 400
        type: validationFailed
        message: АЗС не найдена.
        why: >-
          `poi_id` — не числовой ID точки: например, передан `poi_id` из транзакции,
          номер точки или ID терминала.
        fix: Возьмите числовой `id` точки из `get_azs_list_v1()` или `get_azs_list_v2()`.
      - status: 404
        type: notFound
        message: На АЗС нет рабочих терминалов.
        why: Точка найдена, но сейчас не может провести расчёт по карте.
        fix: Выберите другую точку.
      - status: 403
        type: accessDenied
        message: 'ОТКАЗ. Обратитесь к персоналу торговой точки для повтора операции. [Код ошибки: 12]'
        why: >-
          Процессинг отклонил расчёт по этой карте и точке. Причина — в тексте
          после «ОТКАЗ.», а не в роли или ключе API.
        fix: Покажите текст сообщения пользователю; при необходимости обратитесь к эмитенту карты.
    invalid: []

  check_purchase:
    title: Проверка возможности покупки
    goal: >-
      Проверить до поездки, пройдёт ли покупка набора товаров по карте на
      выбранной АЗС: хватит ли лимитов и не запрещены ли товары ограничителями.
    constants:
      CARD_ID: "900042"
      POI_ID: "900019"
    body: |
      goods = [{"code": "00000000000007", "quantity": 40, "price": 54.35}]
      response = await client.final_prices.check_purchase(
          card_id=CARD_ID, poi_id=POI_ID, goods=goods
      )
      print("Покупка возможна" if response.data else "Покупка не пройдёт")
    call: 'client.final_prices.check_purchase(card_id=CARD_ID, poi_id=POI_ID, goods=[{"code": "00000000000007", "quantity": 1, "price": 54.35}])'
    notes:
      - >-
        Каждый товар описывается кодом, количеством и ценой. SDK проверяет их
        моделью `PurchaseGoodItem` до входа и запроса: лишние поля (например,
        опечатка `qty`), пустой код и количество или цена не больше нуля дают
        `ValidationError`.
      - >-
        SDK отправляет `poi_id` и `goods` телом JSON.
      - >-
        Отказ процессинга (например, недостаточно средств) приходит как
        `403 accessDenied` с кодом причины в тексте сообщения, например «ОТКАЗ.
        Недостаточно средств. [Код ошибки: 51]» — см. также `get_final_prices`.
    errors:
      - status: 404
        type: notFound
        message: Карта не найдена
        why: Карты с таким `card_id` нет в договоре.
        fix: Возьмите `id` карты из `client.cards.get_cards_v2()`.
      - status: 403
        type: accessDenied
        message: 'ОТКАЗ. Недостаточно средств. [Код ошибки: 51]'
        why: >-
          Процессинг отклонил проверку покупки. Причина — в тексте после
          «ОТКАЗ.», а не в роли или ключе API.
        fix: Покажите текст сообщения пользователю.
    invalid:
      - code: 'client.final_prices.check_purchase(card_id=CARD_ID, poi_id=POI_ID, goods=[{"code": "00000000000007"}])'
        why: У товара не указаны количество и цена.

# Источник учебных примеров домена card_groups. Формат полей — в examples/methods/cards.yaml.

domain: card_groups
title: Группы карт
summary: >-
  Группы объединяют карты договора: на группу можно назначить лимиты и
  ограничения сразу для всех её карт.

methods:
  get_card_groups:
    title: Список групп карт
    goal: >-
      Получить группы карт договора с количеством карт в каждой. ID группы нужен
      для лимитов, ограничений и списка карт группы.
    body: |
      response = await client.card_groups.get_card_groups()
      print(f"Групп: {response.data.total_count}")
      for group in response.data.result:
          print(f"{group.id}  {group.name}  карт: {group.cards_count}  статус: {group.status}")
    call: client.card_groups.get_card_groups()
    notes:
      - >-
        `cards_count` приходит строкой, например `"3"`.
      - >-
        Сразу после создания группы или изменения её состава (`set_cards_to_group`)
        `status` и `cards_count` могут быть пустыми ещё несколько секунд: состав
        группы применяется не мгновенно. Если код опирается на актуальный состав,
        подождите и прочитайте группу ещё раз, а не считайте пустой ответ ошибкой.
    errors:
      - status: 403
        type: accessDenied
        message: Нет доступа к договору
        why: Пользователь API не имеет доступа к выбранному договору.
        fix: Проверьте `contract_id` и права пользователя.
    invalid: []

  set_card_group:
    title: Создание и переименование группы карт
    goal: >-
      Создать группу карт с заданным именем. Если передать `group_id` уже
      существующей группы, тот же метод переименует эту группу.
    body: |
      response = await client.card_groups.set_card_group(name="Самосвалы")
      print(f"ID группы: {response.data.id}")
    call: client.card_groups.set_card_group(name="Самосвалы")
    notes:
      - >-
        Имя группы не обязано быть уникальным: сервер не отклоняет повтор и
        создаёт новую группу с тем же именем и новым `id`. SDK не проверяет
        уникальность и не повторяет метод автоматически — при сетевой ошибке
        сначала проверьте список групп через `get_card_groups()`, иначе можно
        случайно создать вторую группу с тем же именем.
      - >-
        Имя — от 1 до 50 символов. Двоеточие в имени сервер не отклоняет с
        понятной ошибкой: запрос завершается `500 internalError`. Если имя
        формируется автоматически (например, включает время), избегайте `:` и
        других специальных символов.
    errors:
      - status: 400
        type: validationFailed
        message: Количество символов в поле Имя должно быть между 1 и 50
        why: Имя пустое или длиннее 50 символов.
        fix: Сократите имя группы до 50 символов.
    invalid:
      - code: client.card_groups.set_card_group(name="  ")
        why: Пустое имя группы отклоняется до отправки запроса.

  set_cards_to_group:
    title: Добавление и удаление карт в группе
    goal: >-
      Добавить карты в группу или убрать их из неё одним запросом. Для каждой
      карты указывается действие `Attach` или `Detach`.
    constants:
      GROUP_ID: "1-2656PK1"
      ATTACH_CARD_ID: "2728111"
      DETACH_CARD_ID: "2728112"
    imports: ["from apisdkopti24.models.card_group import CardGroupAssignmentRequest"]
    body: |
      cards = [
          CardGroupAssignmentRequest(id=ATTACH_CARD_ID, type="Attach"),
          CardGroupAssignmentRequest(id=DETACH_CARD_ID, type="Detach"),
      ]
      response = await client.card_groups.set_cards_to_group(group_id=GROUP_ID, cards_list=cards)
      print("Состав группы изменён" if response.data else "Сервер не подтвердил изменение")
    call: 'client.card_groups.set_cards_to_group(group_id=GROUP_ID, cards_list=[{"id": ATTACH_CARD_ID, "type": "Attach"}])'
    notes:
      - >-
        Вместо моделей можно передать словари `{"id": ..., "type": ...}`: SDK
        проверит их той же моделью.
      - >-
        Список SDK отправляет одним полем формы со строкой JSON-массива:
        `cards_list=[{"id":...,"type":"Attach"}]`.
      - >-
        Изменение состава применяется не сразу: `data: true` означает, что запрос
        принят, но карта может не появиться (или не исчезнуть) в
        `get_card_groups()` и `get_cards_v1(group_id=...)` ещё до нескольких
        десятков секунд. Не считайте привязку неудавшейся по первому же чтению
        сразу после вызова.
    errors:
      - status: 404
        type: notFound
        message: Группа карт не найдена
        why: Группа удалена или принадлежит другому договору.
        fix: Обновите список групп через `get_card_groups()`.
    invalid:
      - code: 'client.card_groups.set_cards_to_group(group_id=GROUP_ID, cards_list=[{"id": "2728111", "type": "Move"}])'
        why: Допустимы только действия `Attach` и `Detach`.

  remove_card_group:
    title: Удаление группы карт
    goal: Удалить группу карт. Сами карты остаются в договоре.
    constants:
      GROUP_ID: "1-2645PK1"
    body: |
      response = await client.card_groups.remove_card_group(group_id=GROUP_ID)
      print("Группа удалена" if response.data else "Сервер не подтвердил удаление")
    call: client.card_groups.remove_card_group(group_id=GROUP_ID)
    notes:
      - >-
        Метод заметно медленнее других изменяющих вызовов: ответ обычно приходит
        через 9–11 секунд, а бывает, что его нет и через 120 секунд, хотя группа уже
        удалена. SDK ждёт ответа до 300 секунд (класс таймаута `slow_mutation`),
        после этого поднимает `APIResponseTimeoutError` и метод не повторяет. Такая
        ошибка не значит, что группа осталась: проверьте `get_card_groups()`. При
        необходимости увеличьте `TimeoutPolicy.slow_mutation`.
      - >-
        Если клиент не дождался ответа и повторяет запрос, повторный вызов на уже
        удалённую группу может прийти как `403 accessDenied` («Нет доступа»), а не
        `404 notFound`. Перед повтором обновите список групп через
        `get_card_groups()` и убедитесь, что группа ещё существует.
    errors:
      - status: 404
        type: notFound
        message: Группа карт не найдена
        why: Группа уже удалена или принадлежит другому договору.
        fix: Обновите список групп через `get_card_groups()`.
    invalid:
      - code: client.card_groups.remove_card_group(group_id="")
        why: Пустой `group_id` отклоняется до отправки запроса.

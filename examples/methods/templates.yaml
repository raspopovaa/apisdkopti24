# Источник учебных примеров домена templates. Формат полей — в examples/methods/cards.yaml.

domain: templates
title: Шаблоны виртуальных карт
summary: >-
  Шаблон задаёт тип виртуальной карты и её лимиты, товарные и географические
  ограничения. Карты, выпущенные по шаблону, получают эти настройки.

methods:
  get_templates:
    title: Список шаблонов
    goal: Получить шаблоны виртуальных карт договора с их типом.
    body: |
      response = await client.templates.get_templates()
      for template in response.data.result:
          print(f"{template.id}  {template.name}  тип: {template.type}")
    call: client.templates.get_templates()
    notes:
      - >-
        Тип `Wallet` означает, что карты по шаблону будут электронными кошельками,
        `Limit` — лимитными.
    errors:
      - status: 403
        type: accessDenied
        message: Нет доступа к договору
        why: Пользователь API не имеет доступа к договору.
        fix: Проверьте `contract_id` и права пользователя.
    invalid: []

  create_template:
    title: Создание шаблона
    goal: >-
      Создать шаблон виртуальной карты. Затем к нему добавляются лимиты и
      ограничения, а сам шаблон закрепляется за пользователем.
    body: |
      response = await client.templates.create_template(type_="Wallet", name="Водители Москва")
      print(f"ID шаблона: {response.data}")
    call: client.templates.create_template(type_="Wallet", name="Водители Москва")
    notes:
      - >-
        Шаблон закрепляется за пользователем через `client.users.attach_contracts()`
        (поле `template_id`).
      - >-
        Имя шаблона — от 1 до 30 символов: более длинное API отклоняет с
        ошибкой `400`, поэтому SDK проверяет длину до платного запроса.
      - >-
        В описании API тело запроса — JSON, но SDK отправляет форму: сервер её
        принимает.
    errors:
      - status: 409
        type: duplicateConflict
        message: Шаблон с таким именем уже существует
        why: Имя шаблона должно быть уникальным в рамках договора.
        fix: Выберите другое имя или найдите шаблон через `get_templates()`.
    invalid:
      - code: client.templates.create_template(type_="Credit", name="Водители Москва")
        why: Тип шаблона может быть только `Limit` или `Wallet`.
      - code: client.templates.create_template(type_="Limit", name="Водители Москва и Московской области")
        why: Имя длиннее 30 символов сервер отклонил бы.

  update_template:
    title: Изменение шаблона
    goal: Изменить имя или тип шаблона.
    constants:
      TEMPLATE_ID: "1-T000042"
    body: |
      response = await client.templates.update_template(
          template_id=TEMPLATE_ID, type_="Wallet", name="Водители Москва и МО"
      )
      print(f"Шаблон обновлён: {response.data}")
    call: client.templates.update_template(template_id=TEMPLATE_ID, type_="Wallet", name="Водители Москва и МО")
    notes:
      - >-
        Сервер принимает изменение шаблона только методом PUT. По умолчанию SDK
        отправляет POST с полем `_method=PUT` (`use_post=True`); `use_post=False`
        отправляет запрос PUT.
      - >-
        Имя шаблона — от 1 до 30 символов: более длинное API отклоняет с
        ошибкой `400`, поэтому SDK проверяет длину до платного запроса.
      - >-
        В описании API тело запроса — JSON, но SDK отправляет форму: сервер её
        принимает.
    errors:
      - status: 404
        type: notFound
        message: Шаблон не найден
        why: Шаблона с таким ID нет в договоре.
        fix: Возьмите ID из `get_templates()`.
    invalid:
      - code: client.templates.update_template(template_id=TEMPLATE_ID, type_="Wallet", name="")
        why: Пустое имя шаблона отклоняется моделью запроса.

  delete_template:
    title: Удаление шаблона
    goal: Удалить шаблон виртуальной карты.
    constants:
      TEMPLATE_ID: "1-T000041"
    body: |
      response = await client.templates.delete_template(template_id=TEMPLATE_ID)
      print("Шаблон удалён" if response.data else "Сервер не подтвердил удаление")
    call: client.templates.delete_template(template_id=TEMPLATE_ID)
    notes:
      - >-
        Если инфраструктура не пропускает запросы DELETE, передайте
        `use_post=True`: SDK отправит POST с полем `_method=DELETE`.
    errors:
      - status: 404
        type: notFound
        message: Шаблон не найден
        why: Шаблон уже удалён.
        fix: Ничего делать не нужно.
    invalid: []

  get_template_limits:
    title: Лимиты шаблона
    goal: Получить лимиты, которые получат карты, выпущенные по шаблону.
    constants:
      TEMPLATE_ID: "1-T000043"
    body: |
      response = await client.templates.get_template_limits(template_id=TEMPLATE_ID)
      for limit in response.data.result:
          if limit.amount is not None:
              print(f"{limit.id}: {limit.productTypeName} — {limit.amount.value} {limit.amount.unit}")
    call: client.templates.get_template_limits(template_id=TEMPLATE_ID)
    response:
      status:
        code: 200
      data:
        total_count: 2
        result:
        - term:
            days: null
            time: null
            type: 1
          transactions:
            count: 0
          template_id: 1-T000043
          contract_id: 1-T000036
          id: 1-T000044
          amount:
            unit: LIT
            value: 3000
          sum: null
          time:
            type: 5
            number: '1'
          date: '12/17/2019 13:07:17'
          productType: 1-276PF01
          productGroup: 1-276PF0E
          productTypeName: Топливо
          productTypeNameNormal: Топливо
          productGroupName: G-95
        - term:
            days: null
            time: null
            type: 1
          transactions:
            count: 0
          template_id: 1-T000043
          contract_id: 1-T000036
          id: 1-T000045
          amount:
            unit: LIT
            value: 500
          sum: null
          time:
            type: 5
            number: '1'
          date: '12/17/2019 13:07:29'
          productType: 1-276PF01
          productGroup: 1-276PF0E
          productTypeName: Топливо
          productTypeNameNormal: Топливо
          productGroupName: G-95
      timestamp: 1585191856
    notes:
      - >-
        `date` приходит в формате `MM/DD/YYYY HH:MM:SS`, `time.number` —
        строкой; SDK приводит его к `int`.
    errors:
      - status: 404
        type: notFound
        message: Шаблон не найден
        why: Шаблона с таким ID нет в договоре.
        fix: Возьмите ID из `get_templates()`.
    invalid: []

  create_template_limit:
    title: Добавление лимита в шаблон
    goal: >-
      Добавить лимит в шаблон: например, не больше 5000 рублей на бензин в месяц.
    constants:
      TEMPLATE_ID: "1-T000042"
    imports: ["from apisdkopti24.models.templates import TemplateLimitCreateRequest"]
    body: |
      payload = TemplateLimitCreateRequest(
          product_type="1-276PF01",
          sum={"currency": "810", "value": 5000},
          time={"type": 5, "number": 1},
      )
      response = await client.templates.create_template_limit(template_id=TEMPLATE_ID, payload=payload)
      print(f"ID лимита: {response.data}")
    call: 'client.templates.create_template_limit(template_id=TEMPLATE_ID, payload={"product_type": "1-276PF01", "sum": {"currency": "810", "value": 5000}, "time": {"type": 5, "number": 1}})'
    notes:
      - >-
        `create_restriction=True` вместе с лимитом создаёт и товарный ограничитель
        на тот же продукт.
      - >-
        Тип периода `time.type`: 2 — разовый, 3 — сутки, 4 — неделя, 5 — месяц,
        6 — квартал, 7 — год.
      - >-
        `sum`, `amount`, `time` и `term` проверяются так же, как у лимитов карт:
        лишние поля запрещены, сумма — не больше двух знаков после запятой,
        `term.days` — 7 символов `0` или `1`, `term.type` — 1, 2 или 3.
      - >-
        Договор задаётся один раз: аргументом `contract_id` или полем
        `contract_id` в `payload`. Разные значения SDK отклоняет до запроса.
    errors:
      - status: 400
        type: validationFailed
        message: Некорректный тип продукта
        why: Тип продукта не найден в справочнике.
        fix: Возьмите код из справочника `ProductType`.
    invalid:
      - code: 'client.templates.create_template_limit(template_id=TEMPLATE_ID, payload={"sum": {"currency": "810", "value": 5000}, "time": {"type": 5, "number": 1}})'
        why: Тип продукта `product_type` обязателен.
      - code: 'client.templates.create_template_limit(template_id=TEMPLATE_ID, payload={"product_type": "1-276PF01", "sum": {"currency": "810", "valeu": 5000}, "time": {"type": 5, "number": 1}})'
        why: Опечатка в поле суммы (`valeu`) не уходит на сервер молча.

  update_template_limit:
    title: Изменение лимита шаблона
    goal: Изменить сумму, объём или период лимита шаблона.
    constants:
      TEMPLATE_ID: "1-T000042"
      LIMIT_ID: "1-T000045"
    body: |
      limit = {
          "product_type": "1-276PF01",
          "sum": {"currency": "810", "value": 7000},
          "time": {"type": 5, "number": 1},
      }
      response = await client.templates.update_template_limit(
          template_id=TEMPLATE_ID, limit_id=LIMIT_ID, limit=limit
      )
      print(f"Лимит обновлён: {response.data}")
    call: 'client.templates.update_template_limit(template_id=TEMPLATE_ID, limit_id=LIMIT_ID, limit={"product_type": "1-276PF01", "sum": {"currency": "810", "value": 7000}, "time": {"type": 5, "number": 1}})'
    notes:
      - >-
        По умолчанию SDK отправляет изменение запросом POST с полем `_method=PUT`
        (`use_post=True`); `use_post=False` отправляет запрос PUT.
      - >-
        `limit` — новые параметры лимита `limit_id`. В теле запроса SDK отправляет
        объект лимита, а не массив: массив сервер отклоняет с кодом `405`.
    errors:
      - status: 404
        type: notFound
        message: Лимит не найден
        why: Лимита с таким ID нет в шаблоне.
        fix: Возьмите ID из `get_template_limits()`.
    invalid:
      - code: client.templates.update_template_limit(template_id=TEMPLATE_ID, limit_id=LIMIT_ID)
        why: Не переданы новые параметры лимита `limit`.

  delete_template_limit:
    title: Удаление лимита шаблона
    goal: Удалить лимит из шаблона.
    constants:
      TEMPLATE_ID: "1-T000042"
      LIMIT_ID: "1-T000045"
    body: |
      response = await client.templates.delete_template_limit(template_id=TEMPLATE_ID, limit_id=LIMIT_ID)
      print("Лимит удалён" if response.data else "Сервер не подтвердил удаление")
    call: client.templates.delete_template_limit(template_id=TEMPLATE_ID, limit_id=LIMIT_ID)
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Лимит не найден
        why: Лимит уже удалён.
        fix: Ничего делать не нужно.
    invalid: []

  get_template_restrictions:
    title: Товарные ограничители шаблона
    goal: Получить товарные ограничители шаблона.
    constants:
      TEMPLATE_ID: "1-T000043"
    body: |
      response = await client.templates.get_template_restrictions(template_id=TEMPLATE_ID)
      for item in response.data.result:
          kind = "разрешено" if item.restriction_type == 1 else "запрещено"
          print(f"{item.id}: {item.productTypeName} — {kind}")
    call: client.templates.get_template_restrictions(template_id=TEMPLATE_ID)
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Шаблон не найден
        why: Шаблона с таким ID нет в договоре.
        fix: Возьмите ID из `get_templates()`.
    invalid: []

  create_template_restriction:
    title: Добавление товарного ограничителя в шаблон
    goal: Разрешить или запретить в шаблоне тип продукта.
    constants:
      TEMPLATE_ID: "1-T000043"
    body: |
      response = await client.templates.create_template_restriction(
          template_id=TEMPLATE_ID,
          payload={"product_type": "1-276PF01", "product_group": "1-276PF0E", "restriction_type": 1},
      )
      print(f"ID ограничителя: {response.data}")
    call: 'client.templates.create_template_restriction(template_id=TEMPLATE_ID, payload={"product_type": "1-276PF01", "restriction_type": 1})'
    notes:
      - >-
        `restriction_type`: 1 — разрешающий ограничитель, 2 — запрещающий.
    errors:
      - status: 400
        type: validationFailed
        message: Некорректный тип продукта
        why: Тип продукта не найден в справочнике.
        fix: Возьмите код из справочника `ProductType`.
    invalid:
      - code: 'client.templates.create_template_restriction(template_id=TEMPLATE_ID, payload={"product_type": "1-276PF01", "restriction_type": 3})'
        why: Тип ограничителя может быть только 1 или 2.

  update_template_restriction:
    title: Изменение товарного ограничителя шаблона
    goal: Изменить тип продукта или вид товарного ограничителя шаблона.
    constants:
      TEMPLATE_ID: "1-T000043"
      RESTRICTION_ID: "1-T000047"
    body: |
      response = await client.templates.update_template_restriction(
          template_id=TEMPLATE_ID,
          restriction_id=RESTRICTION_ID,
          payload={"product_type": "1-276PF01", "restriction_type": 2},
      )
      print(f"Ограничитель обновлён: {response.data}")
    call: 'client.templates.update_template_restriction(template_id=TEMPLATE_ID, restriction_id=RESTRICTION_ID, payload={"product_type": "1-276PF01", "restriction_type": 2})'
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Ограничитель не найден
        why: Ограничителя с таким ID нет в шаблоне.
        fix: Возьмите ID из `get_template_restrictions()`.
    invalid: []

  delete_template_restriction:
    title: Удаление товарного ограничителя шаблона
    goal: Удалить товарный ограничитель из шаблона.
    constants:
      TEMPLATE_ID: "1-T000043"
      RESTRICTION_ID: "1-T000047"
    body: |
      response = await client.templates.delete_template_restriction(
          template_id=TEMPLATE_ID, restriction_id=RESTRICTION_ID
      )
      print("Ограничитель удалён" if response.data else "Сервер не подтвердил удаление")
    call: client.templates.delete_template_restriction(template_id=TEMPLATE_ID, restriction_id=RESTRICTION_ID)
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Ограничитель не найден
        why: Ограничитель уже удалён.
        fix: Ничего делать не нужно.
    invalid: []

  get_template_georestrictions:
    title: Географические ограничения шаблона
    goal: Получить страны, регионы и АЗС, где разрешено или запрещено пользоваться картами шаблона.
    constants:
      TEMPLATE_ID: "1-T000043"
    body: |
      response = await client.templates.get_template_georestrictions(template_id=TEMPLATE_ID)
      for item in response.data.result:
          print(f"{item.id}: {item.countryName}, {item.regionName}")
    call: client.templates.get_template_georestrictions(template_id=TEMPLATE_ID)
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Шаблон не найден
        why: Шаблона с таким ID нет в договоре.
        fix: Возьмите ID из `get_templates()`.
    invalid: []

  create_template_georestriction:
    title: Добавление географического ограничения в шаблон
    goal: Разрешить или запретить картам шаблона работу в стране, регионе или на АЗС.
    constants:
      TEMPLATE_ID: "1-T000043"
    body: |
      response = await client.templates.create_template_georestriction(
          template_id=TEMPLATE_ID,
          payload={"country": "RUS", "region": "45", "restriction_type": 1},
      )
      print(f"ID ограничения: {response.data}")
    call: 'client.templates.create_template_georestriction(template_id=TEMPLATE_ID, payload={"country": "RUS", "restriction_type": 1})'
    notes:
      - >-
        Коды стран и регионов берутся из справочников `Country` и `Region`,
        партнёров — из `POIPartner`.
    errors:
      - status: 400
        type: validationFailed
        message: Неизвестный регион
        why: Код страны или региона не найден в справочниках.
        fix: Возьмите коды из справочников `Country` и `Region`.
    invalid:
      - code: 'client.templates.create_template_georestriction(template_id=TEMPLATE_ID, payload={"region": "45", "restriction_type": 1})'
        why: Страна `country` обязательна.

  update_template_georestriction:
    title: Изменение географического ограничения шаблона
    goal: Изменить страну, регион или вид географического ограничения шаблона.
    constants:
      TEMPLATE_ID: "1-T000043"
      GEORESTRICTION_ID: "1-T000050"
    body: |
      response = await client.templates.update_template_georestriction(
          template_id=TEMPLATE_ID,
          georestriction_id=GEORESTRICTION_ID,
          payload={"country": "RUS", "region": "50", "restriction_type": 1},
      )
      print(f"Ограничение обновлено: {response.data}")
    call: 'client.templates.update_template_georestriction(template_id=TEMPLATE_ID, georestriction_id=GEORESTRICTION_ID, payload={"country": "RUS", "restriction_type": 1})'
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Ограничение не найдено
        why: Ограничения с таким ID нет в шаблоне.
        fix: Возьмите ID из `get_template_georestrictions()`.
    invalid: []

  delete_template_georestriction:
    title: Удаление географического ограничения шаблона
    goal: Удалить географическое ограничение из шаблона.
    constants:
      TEMPLATE_ID: "1-T000043"
      GEORESTRICTION_ID: "1-T000050"
    body: |
      response = await client.templates.delete_template_georestriction(
          template_id=TEMPLATE_ID, georestriction_id=GEORESTRICTION_ID
      )
      print("Ограничение удалено" if response.data else "Сервер не подтвердил удаление")
    call: client.templates.delete_template_georestriction(template_id=TEMPLATE_ID, georestriction_id=GEORESTRICTION_ID)
    notes: []
    errors:
      - status: 404
        type: notFound
        message: Ограничение не найдено
        why: Ограничение уже удалено.
        fix: Ничего делать не нужно.
    invalid: []

      timestamp: 1596024392
    notes:
      - >-
        `period` — месяц в формате `YYYY-MM` или день в формате `YYYY-MM-DD`. Без
        `period` SDK запрашивает текущий месяц по часам клиента. Значение с
        временем (`YYYY-MM-DD HH:MM:SS`) API понимает как начало окна в 24 часа
        вперёд от этого момента: для текущего момента такое окно ещё пусто.
      - >-
        `methods.all` — число платных вызовов за период; остальные ключи
        `methods` — счётчики по кодам методов, которые вызывались (например,
        `cards_detail`, `setcardproduct`). Какие коды платные, а какие нет,
        показывает `methods_info`. Ответы с ошибкой (`403`, `404`, `429`, `500`)
        в счётчики не попадают.
      - >-
        `client_info.ClientType` — тип клиента, например `C` или `S`;
        `PricePlan` и `Queries` — тариф и включённое в него число запросов.
    errors:

  logoff:
    title: Завершение сессии
    goal: >-
      Завершить серверную сессию, когда работа с API закончена. Закрытие клиента
      (`async with APIClient(...)`) освобождает только локальные ресурсы и сессию
      на сервере не завершает.
    body: |
      response = await client.auth.logoff()
      if response is None:
          print("Активной сессии не было: запрос не отправлялся")
      else:
          print("Сессия завершена" if response.data else "Сервер не подтвердил выход")
    call: client.auth.logoff()
    notes:
      - >-
        SDK очищает локальную сессию и выбранный договор даже при ошибке запроса.
        Следующий вызов любого метода снова авторизуется автоматически.
      - >-
        Без активной сессии запрос не отправляется: метод очищает локальное
        состояние и возвращает `None`, а не авторизуется ради выхода. Если
        сессия на сервере уже истекла и API ответил `401`, SDK тоже не входит
        заново: сессия считается завершённой, метод возвращает `None`.
    errors: []
    invalid: []
